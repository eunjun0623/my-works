<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 작업실</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f5;
    --bar: #d9dfe7;
    --tab: #e6ebf1;
    --tab-active: #ffffff;
    --ink: #1d2733;
    --muted: #5d6b7a;
    --line: #c3ccd7;
    --accent: #2f5bea;
    --danger: #c23b3b;
    --tile: #ffffff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161b22; --bar: #0f1318; --tab: #1c222a; --tab-active: #262e38;
      --ink: #e4e9ef; --muted: #93a1b0; --line: #313b47; --accent: #7b9cff;
      --danger: #ff7a7a; --tile: #1f262f;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 탭 바 */
  .tabbar {
    display: flex; align-items: flex-end; gap: 2px;
    background: var(--bar); padding: 8px 8px 0;
    overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
  }
  .tabbar::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; align-items: center; gap: 6px;
    background: var(--tab); border-radius: 10px 10px 0 0;
    padding: 0 6px 0 12px; height: 38px; min-width: 0; max-width: 200px; flex-shrink: 0;
  }
  .tab.active { background: var(--tab-active); }
  .tab.home { padding-right: 12px; }
  .tab-open {
    border: 0; background: none; display: flex; align-items: center; gap: 6px;
    min-width: 0; padding: 0; height: 100%; font-size: 14px;
  }
  .tab-open span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab-close {
    border: 0; background: none; width: 24px; height: 24px; border-radius: 6px;
    color: var(--muted); font-size: 16px; line-height: 1; flex-shrink: 0;
  }
  .tab-close:hover { background: var(--bar); color: var(--ink); }

  /* 주소 줄 */
  .toolbar {
    display: none; align-items: center; gap: 6px;
    background: var(--tab-active); border-bottom: 1px solid var(--line);
    padding: 6px 10px; flex-shrink: 0;
  }
  .toolbar.show { display: flex; }
  .toolbar .addr {
    flex: 1; min-width: 0; font-size: 13px; color: var(--muted);
    background: var(--bg); border-radius: 8px; padding: 6px 10px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tool-btn {
    border: 0; background: none; height: 30px; padding: 0 10px; border-radius: 8px; font-size: 13px;
  }
  .tool-btn:hover { background: var(--bg); }

  /* 본문 */
  main { flex: 1; position: relative; min-height: 0; }
  .panel { position: absolute; inset: 0; display: none; }
  .panel.show { display: block; }
  .panel iframe { width: 100%; height: 100%; border: 0; background: #fff; display: block; }

  /* 홈 */
  #home { overflow-y: auto; }
  .home-inner { max-width: 880px; margin: 0 auto; padding: 48px 20px 64px; }
  .home-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 6px 0 32px; font-size: 15px; }
  .head-actions { display: flex; gap: 6px; }
  .ghost {
    border: 1px solid var(--line); background: none; border-radius: 8px;
    padding: 6px 12px; font-size: 13px;
  }
  .ghost[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .tile {
    position: relative; background: var(--tile); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px 14px 14px; text-align: left; display: flex; flex-direction: column; gap: 10px;
    min-height: 130px; width: 100%;
  }
  .tile:hover { border-color: var(--accent); }
  .tile .emoji { font-size: 34px; line-height: 1; }
  .tile .name { font-weight: 500; font-size: 15px; word-break: keep-all; }
  .tile .host { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: auto; }
  .tile-edit { position: absolute; top: 8px; right: 8px; display: none; gap: 4px; }
  .editing .tile-edit { display: flex; }
  .editing .tile { border-style: dashed; }
  .mini { border: 0; background: var(--bg); border-radius: 6px; font-size: 12px; padding: 4px 8px; }
  .mini.del { color: var(--danger); }

  .add-tile {
    border: 1.5px dashed var(--line); background: none; border-radius: 14px; min-height: 130px;
    color: var(--muted); font-size: 15px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
  }
  .add-tile:hover { color: var(--accent); border-color: var(--accent); }
  .add-tile b { font-size: 28px; font-weight: 400; }

  .empty-note { grid-column: 1 / -1; color: var(--muted); font-size: 14px; margin: 0 0 4px; }
  .tag { font-size: 11px; color: var(--accent); }
  .sync {
    margin-top: 28px; border: 1px solid var(--accent); border-radius: 12px;
    padding: 12px 16px; font-size: 14px; line-height: 1.6;
  }
  .sync p { margin: 0; }
  .sync[hidden] { display: none; }
  .foot { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }

  /* 입력 창 */
  dialog {
    border: 0; border-radius: 16px; padding: 0; width: min(420px, calc(100% - 32px));
    background: var(--tab-active); color: var(--ink);
  }
  dialog::backdrop { background: rgba(10, 15, 22, 0.45); }
  .dlg { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .dlg h2 { margin: 0; font-size: 18px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
  input[type="text"], input[type="url"] {
    font: inherit; font-size: 15px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  .row { display: flex; gap: 10px; }
  .row label:first-child { width: 80px; flex-shrink: 0; }
  .row label:last-child { flex: 1; }
  .err { color: var(--danger); font-size: 13px; min-height: 1em; margin: 0; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .primary { border: 0; background: var(--accent); color: #fff; border-radius: 8px; padding: 9px 16px; font-weight: 500; }

  .hint {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); font-size: 13px; padding: 8px 14px; border-radius: 10px;
    max-width: calc(100% - 32px); display: flex; gap: 10px; align-items: center;
  }
  .hint button { border: 0; background: none; color: inherit; text-decoration: underline; font-size: 13px; padding: 0; }
  .hint[hidden] { display: none; }

  @media (max-width: 520px) {
    .home-inner { padding-top: 28px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  }
</style>
</head>
<body>

<nav class="tabbar" id="tabbar" aria-label="열린 탭"></nav>

<div class="toolbar" id="toolbar">
  <div class="addr" id="addr"></div>
  <button class="tool-btn" id="reloadBtn" title="새로고침">↻ 새로고침</button>
  <button class="tool-btn" id="popBtn" title="새 창에서 열기">새 창</button>
</div>

<main id="main">
  <section class="panel show" id="home">
    <div class="home-inner">
      <div class="home-head">
        <h1>내 작업실</h1>
        <div class="head-actions">
          <button class="ghost" id="editBtn" aria-pressed="false">편집</button>
        </div>
      </div>
      <p class="sub">내가 만든 것들을 여기서 열어요.</p>
      <div class="grid" id="grid"></div>
      <div class="sync" id="syncNote" hidden>
        <p><b>이 기기에서만 바뀐 내용이 <span id="syncCount">0</span>건 있어요.</b>
        다른 기기에서도 보이게 하려면 아래 <b>목록 파일 받기</b>를 누르고, 받은 apps.json으로 허브 폴더의 apps.json을 바꾼 뒤 Netlify에 다시 올리세요.</p>
      </div>
      <div class="foot">
        <button class="ghost" id="exportBtn">목록 파일 받기 (apps.json)</button>
        <button class="ghost" id="importBtn">파일 불러오기</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </div>
  </section>
  <div class="hint" id="hint" hidden>
    <span>화면이 비어 있다면 이 사이트는 안에 띄울 수 없는 곳이에요.</span>
    <button id="hintPop">새 창에서 열기</button>
  </div>
</main>

<dialog id="dlg">
  <form class="dlg" method="dialog" id="form">
    <h2 id="dlgTitle">사이트 추가</h2>
    <label>이름
      <input type="text" id="fName" maxlength="30" placeholder="예: 직관 기록장" required>
    </label>
    <div class="row">
      <label>아이콘
        <input type="text" id="fEmoji" maxlength="4" placeholder="⚾">
      </label>
      <label>주소
        <input type="url" id="fUrl" placeholder="my-site.netlify.app" required>
      </label>
    </div>
    <p class="err" id="fErr"></p>
    <div class="dlg-actions">
      <button type="button" class="ghost" id="cancelBtn">취소</button>
      <button type="submit" class="primary" id="saveBtn">추가하기</button>
    </div>
  </form>
</dialog>

<script>
/* ===================================================================
   목록은 두 군데에서 와요.
   1) apps.json  : 허브와 같이 Netlify에 올리는 파일. 어느 기기에서 열어도 보여요.
   2) 이 브라우저 : 화면에서 새로 추가한 것. 파일에 넣기 전까지는 이 기기에만 있어요.
   =================================================================== */
const KEY = 'my-hub-v2';
let state = {
  local: [],        // 이 기기에서만 추가한 사이트
  overrides: {},    // apps.json 사이트를 이 기기에서 고치거나 지운 기록 {원래주소: {...} | {deleted:true}}
  fileCache: [],    // 마지막으로 읽은 apps.json (인터넷이 느릴 때 먼저 보여주기용)
  tabs: [],
  active: 'home',
};
let apps = [];      // 화면에 보이는 최종 목록

function loadLocal() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s) Object.assign(state, {
      local: Array.isArray(s.local) ? s.local : [],
      overrides: s.overrides && typeof s.overrides === 'object' ? s.overrides : {},
      fileCache: Array.isArray(s.fileCache) ? s.fileCache : [],
      tabs: Array.isArray(s.tabs) ? s.tabs : [],
      active: s.active || 'home',
    });
    else {
      // 예전 버전 허브에서 쓰던 목록 옮겨오기
      const old = JSON.parse(localStorage.getItem('my-hub-v1') || 'null');
      if (old && Array.isArray(old.apps)) state.local = old.apps.map(a => ({ ...a, id: a.id || uid() }));
    }
  } catch (e) {}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

/* ===== 도우미 ===== */
const $ = id => document.getElementById(id);
const appById = id => apps.find(a => a.id === id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function hashId(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return 'f' + (h >>> 0).toString(36); }
function normalizeUrl(v) {
  v = String(v || '').trim();
  if (!v) return null;
  if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
  try { const u = new URL(v); return u.hostname.includes('.') ? u.href : null; } catch { return null; }
}
const hostOf = url => { try { return new URL(url).hostname; } catch { return url; } };
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cleanList(list) {
  if (!Array.isArray(list)) return [];
  const out = [];
  for (const x of list) {
    const url = normalizeUrl(x && x.url);
    if (!x || !x.name || !url || out.some(o => o.url === url)) continue;
    out.push({ name: String(x.name).slice(0, 30), url, emoji: x.emoji || '🌐' });
  }
  return out;
}

/* 파일 목록 + 이 기기 변경사항을 합쳐서 최종 목록 만들기 */
function rebuild() {
  const file = state.fileCache;
  const fileUrls = new Set(file.map(f => f.url));
  apps = [];
  for (const f of file) {
    const o = state.overrides[f.url];
    if (o && o.deleted) continue;
    apps.push({ id: hashId(f.url), fixed: true, orig: f.url, ...f, ...(o || {}) });
  }
  // 이미 파일에 들어간 건 '이 기기에만' 목록에서 정리
  state.local = state.local.filter(a => !fileUrls.has(a.url) && !apps.some(x => x.url === a.url));
  for (const a of state.local) apps.push({ ...a, fixed: false });
  // 파일에서 없어진 사이트에 대한 수정 기록도 정리
  for (const k of Object.keys(state.overrides)) if (!fileUrls.has(k)) delete state.overrides[k];
  state.tabs = state.tabs.filter(id => appById(id));
  if (state.active !== 'home' && !appById(state.active)) state.active = 'home';
}

async function fetchFile() {
  try {
    const res = await fetch('apps.json', { cache: 'no-store' });
    if (!res.ok) throw 0;
    state.fileCache = cleanList(await res.json());
    return true;
  } catch { return false; }
}

/* ===== 탭 바 ===== */
function renderTabs() {
  const bar = $('tabbar');
  let html = `<div class="tab home ${state.active === 'home' ? 'active' : ''}">
    <button class="tab-open" data-open="home"><span>🏠</span><span>홈</span></button></div>`;
  for (const id of state.tabs) {
    const a = appById(id);
    if (!a) continue;
    html += `<div class="tab ${state.active === id ? 'active' : ''}">
      <button class="tab-open" data-open="${id}" title="${esc(a.name)}"><span>${esc(a.emoji || '🌐')}</span><span>${esc(a.name)}</span></button>
      <button class="tab-close" data-close="${id}" aria-label="${esc(a.name)} 탭 닫기">×</button></div>`;
  }
  bar.innerHTML = html;
  const cur = bar.querySelector('.tab.active');
  if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
$('tabbar').addEventListener('click', e => {
  const c = e.target.closest('[data-close]');
  if (c) { closeTab(c.dataset.close); return; }
  const o = e.target.closest('[data-open]');
  if (o) activate(o.dataset.open);
});
$('tabbar').addEventListener('auxclick', e => {
  const o = e.target.closest('[data-open]');
  if (e.button === 1 && o && o.dataset.open !== 'home') closeTab(o.dataset.open);
});

/* ===== 탭 열고 닫기 ===== */
let hintTimer;
function panelFor(id) { return document.querySelector(`.panel[data-app="${id}"]`); }

function activate(id) {
  if (id !== 'home' && !appById(id)) id = 'home';
  state.active = id;
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('show'));
  clearTimeout(hintTimer); $('hint').hidden = true;

  if (id === 'home') {
    $('home').classList.add('show');
    $('toolbar').classList.remove('show');
  } else {
    const a = appById(id);
    let p = panelFor(id);
    if (!p) {
      p = document.createElement('section');
      p.className = 'panel';
      p.dataset.app = id;
      const f = document.createElement('iframe');
      f.title = a.name;
      f.allow = 'clipboard-read; clipboard-write; fullscreen; geolocation; camera; microphone';
      f.src = a.url;
      p.appendChild(f);
      $('main').insertBefore(p, $('hint'));
      $('hint').hidden = false;
      hintTimer = setTimeout(() => { $('hint').hidden = true; }, 5000);
    }
    p.classList.add('show');
    $('addr').textContent = a.url;
    $('toolbar').classList.add('show');
  }
  renderTabs();
  save();
}
function openApp(id) {
  if (!state.tabs.includes(id)) state.tabs.push(id);
  activate(id);
}
function closeTab(id) {
  const i = state.tabs.indexOf(id);
  if (i === -1) return;
  state.tabs.splice(i, 1);
  const p = panelFor(id);
  if (p) p.remove();
  if (state.active === id) activate(state.tabs[i] || state.tabs[i - 1] || 'home');
  else { renderTabs(); save(); }
}
$('reloadBtn').onclick = () => {
  const p = panelFor(state.active);
  if (p) p.querySelector('iframe').src = appById(state.active).url;
};
const popOut = () => { const a = appById(state.active); if (a) window.open(a.url, '_blank', 'noopener'); };
$('popBtn').onclick = popOut;
$('hintPop').onclick = popOut;

/* ===== 홈 화면 ===== */
let editing = false;
function hasUnsaved() {
  return state.local.length > 0 || Object.keys(state.overrides).length > 0;
}
function renderGrid() {
  const g = $('grid');
  let html = '';
  if (!apps.length) html += `<p class="empty-note">아직 등록한 사이트가 없어요. Netlify 주소를 넣어서 첫 번째 사이트를 추가해 보세요.</p>`;
  for (const a of apps) {
    html += `<div style="position:relative">
      <button class="tile" data-app="${a.id}">
        <span class="emoji">${esc(a.emoji || '🌐')}</span>
        <span class="name">${esc(a.name)}</span>
        ${a.fixed ? '' : '<span class="tag">이 기기에만</span>'}
        <span class="host">${esc(hostOf(a.url))}</span>
      </button>
      <div class="tile-edit">
        <button class="mini" data-edit="${a.id}">수정</button>
        <button class="mini del" data-del="${a.id}">삭제</button>
      </div></div>`;
  }
  html += `<button class="add-tile" id="addTile"><b>＋</b>사이트 추가</button>`;
  g.innerHTML = html;
  g.classList.toggle('editing', editing);

  const n = state.local.length + Object.keys(state.overrides).length;
  $('syncNote').hidden = !hasUnsaved();
  $('syncCount').textContent = n;
}
$('grid').addEventListener('click', e => {
  const ed = e.target.closest('[data-edit]');
  if (ed) { openForm(ed.dataset.edit); return; }
  const del = e.target.closest('[data-del]');
  if (del) {
    const a = appById(del.dataset.del);
    if (a && confirm(`'${a.name}'을(를) 목록에서 지울까요?`)) {
      closeTab(a.id);
      if (a.fixed) state.overrides[a.orig] = { deleted: true };
      else state.local = state.local.filter(x => x.id !== a.id);
      rebuild(); save(); renderGrid();
    }
    return;
  }
  if (e.target.closest('#addTile')) { openForm(); return; }
  const t = e.target.closest('.tile');
  if (t) { editing ? openForm(t.dataset.app) : openApp(t.dataset.app); }
});
$('editBtn').onclick = () => {
  editing = !editing;
  $('editBtn').setAttribute('aria-pressed', editing);
  $('editBtn').textContent = editing ? '편집 끝내기' : '편집';
  renderGrid();
};

/* ===== 추가 / 수정 창 ===== */
let editingId = null;
function openForm(id) {
  editingId = id || null;
  const a = id ? appById(id) : null;
  $('dlgTitle').textContent = a ? '사이트 수정' : '사이트 추가';
  $('saveBtn').textContent = a ? '저장하기' : '추가하기';
  $('fName').value = a ? a.name : '';
  $('fEmoji').value = a ? a.emoji : '';
  $('fUrl').value = a ? a.url : '';
  $('fErr').textContent = '';
  $('dlg').showModal();
  $('fName').focus();
}
$('cancelBtn').onclick = () => $('dlg').close();
$('fUrl').type = 'text';
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('fName').value.trim();
  const url = normalizeUrl($('fUrl').value);
  const emoji = $('fEmoji').value.trim() || '🌐';
  if (!name) { $('fErr').textContent = '이름을 적어 주세요.'; return; }
  if (!url) { $('fErr').textContent = '주소를 확인해 주세요. 예: my-site.netlify.app'; return; }
  if (apps.some(a => a.url === url && a.id !== editingId)) { $('fErr').textContent = '이미 등록된 주소예요.'; return; }

  if (editingId) {
    const a = appById(editingId);
    const urlChanged = a.url !== url;
    if (a.fixed) state.overrides[a.orig] = { name, url, emoji };
    else Object.assign(state.local.find(x => x.id === a.id), { name, url, emoji });
    rebuild();
    const p = panelFor(editingId);
    if (p && urlChanged) p.querySelector('iframe').src = url;
    if (state.active === editingId) $('addr').textContent = url;
  } else {
    state.local.push({ id: uid(), name, url, emoji });
    rebuild();
  }
  save(); renderGrid(); renderTabs();
  $('dlg').close();
});

/* ===== apps.json 파일 받기 / 불러오기 ===== */
$('exportBtn').onclick = () => {
  const list = apps.map(a => ({ name: a.name, url: a.url, emoji: a.emoji }));
  const blob = new Blob([JSON.stringify(list, null, 2) + '\n'], { type: 'application/json' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'apps.json';
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const list = cleanList(JSON.parse(await file.text()));
    let added = 0;
    for (const x of list) {
      if (apps.some(a => a.url === x.url)) continue;
      state.local.push({ id: uid(), ...x });
      added++;
    }
    rebuild(); save(); renderGrid();
    alert(`${added}개를 불러왔어요.`);
  } catch {
    alert('불러올 수 없는 파일이에요. "목록 파일 받기"로 만든 apps.json을 골라 주세요.');
  }
};

/* ===== 시작 ===== */
(async function start() {
  loadLocal();
  rebuild();                 // 먼저 저장해둔 걸로 바로 보여주고
  renderGrid();
  activate(state.active);
  if (await fetchFile()) {   // apps.json 최신본을 받아서 다시 맞추기
    const before = state.active;
    rebuild(); save();
    renderGrid(); renderTabs();
    if (before !== state.active) activate(state.active);
  }
})();
</script>
