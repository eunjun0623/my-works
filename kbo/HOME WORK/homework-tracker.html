<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숙제 알리미</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --ink:#1B2436;
    --ink-soft:#5C6880;
    --paper:#FCFCF9;
    --grid:#E3E7DF;
    --line:#DDE1D9;
    --hl-yellow:#FFE45E;
    --hl-mint:#7FD9BE;
    --hl-pink:#FF9FB8;
    --alert:#D93A48;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    color:var(--ink);
    background-color:#F5F6F1;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:22px 22px;
    -webkit-font-smoothing:antialiased;
    padding:28px 16px 64px;
    line-height:1.5;
  }
  .wrap{
    max-width:660px;margin:0 auto;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 1px 0 #fff inset;
    overflow:hidden;
  }

  /* ---------- 상단 ---------- */
  .top{
    display:flex;justify-content:space-between;align-items:flex-end;gap:20px;
    padding:26px 24px 18px;
  }
  h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0;}
  .sub{margin:6px 0 0;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .score{text-align:right;flex-shrink:0;}
  .score-figure{
    display:inline-block;
    font-size:46px;font-weight:800;letter-spacing:-.045em;line-height:1.05;
    font-variant-numeric:tabular-nums;
    background-image:linear-gradient(transparent 62%, var(--hl-mint) 62%);
    background-size:100% 100%;
    padding:0 4px;
    transition:background-image .3s ease;
  }
  .score-figure .unit{font-size:22px;font-weight:700;margin-left:1px;}
  .score.mid .score-figure{background-image:linear-gradient(transparent 62%, var(--hl-yellow) 62%);}
  .score.low .score-figure{background-image:linear-gradient(transparent 62%, var(--hl-pink) 62%);}
  .score-label{margin:5px 0 0;font-size:12px;color:var(--ink-soft);}
  .meter{height:5px;background:#EDEFE9;}
  .meter i{display:block;height:100%;width:100%;background:var(--hl-mint);transition:width .45s cubic-bezier(.2,.7,.3,1),background .3s;}
  .score.mid ~ .meter i, .meter.mid i{background:var(--hl-yellow);}
  .meter.low i{background:var(--hl-pink);}

  /* ---------- 입력 ---------- */
  .add{
    display:grid;grid-template-columns:96px 1fr 148px auto;gap:8px;
    padding:16px 24px;border-bottom:1px solid var(--line);background:#F8F9F4;
  }
  input{
    font:inherit;font-size:14px;color:var(--ink);
    padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;
    min-width:0;
  }
  input::placeholder{color:#A6AEBC;}
  input:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px;}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  .btn-add{
    background:var(--ink);color:#fff;font-size:14px;font-weight:700;
    padding:9px 16px;border-radius:7px;
  }
  .btn-add:hover{background:#2C3956;}

  /* ---------- 목록 ---------- */
  .group{padding:6px 24px 0;}
  .group h2{
    font-size:12px;font-weight:700;color:var(--ink-soft);
    margin:16px 0 6px;display:flex;align-items:baseline;gap:7px;
  }
  .group h2 span{font-weight:500;font-size:11px;color:#9AA3B2;font-variant-numeric:tabular-nums;}
  ul{list-style:none;margin:0;padding:0;}
  .row{
    display:flex;align-items:center;gap:11px;
    padding:11px 2px;border-bottom:1px solid #EFF1EB;
    transition:opacity .35s ease,transform .35s ease;
  }
  .row:last-child{border-bottom:none;}
  .check{
    flex-shrink:0;width:21px;height:21px;border:2px solid #C3CAD6;border-radius:6px;
    background:#fff;position:relative;transition:border-color .15s,background .15s;
  }
  .check:hover{border-color:var(--ink);}
  .check::after{
    content:"";position:absolute;left:5px;top:1px;width:6px;height:11px;
    border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(42deg) scale(.4);
    opacity:0;transition:.15s;
  }
  .row.done .check{background:var(--ink);border-color:var(--ink);}
  .row.done .check::after{opacity:1;transform:rotate(42deg) scale(1);}
  .row.done{opacity:0;transform:translateX(14px);}
  .tag{
    flex-shrink:0;font-size:12px;font-weight:700;padding:3px 9px;border-radius:5px;
    max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .task{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dday{
    flex-shrink:0;font-size:12px;font-weight:700;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  }
  .dday.hot{color:var(--alert);}
  .date{flex-shrink:0;font-size:11.5px;color:#A6AEBC;font-variant-numeric:tabular-nums;}
  .kill{flex-shrink:0;font-size:16px;color:#C3CAD6;padding:0 2px;line-height:1;}
  .kill:hover{color:var(--alert);}

  .empty{padding:46px 24px 50px;text-align:center;color:var(--ink-soft);font-size:14px;}
  .empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:5px;}

  /* ---------- 기록 ---------- */
  .foot{border-top:1px solid var(--line);padding:14px 24px 18px;background:#F8F9F4;}
  .foot-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .stats{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .stats b{color:var(--ink);font-weight:700;}
  .link{font-size:13px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;}
  .link:hover{color:var(--ink);}
  .log{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;max-height:230px;overflow:auto;}
  .log-row{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13px;}
  .log-row .mark{flex-shrink:0;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;}
  .mark.ok{background:var(--hl-mint);color:#0E4437;}
  .mark.no{background:var(--hl-pink);color:#6A1226;}
  .log-row .what{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-soft);}
  .log-empty{font-size:13px;color:#A6AEBC;padding:6px 0;}
  .reset{margin-top:10px;font-size:12px;color:#A6AEBC;text-decoration:underline;text-underline-offset:3px;}
  .reset:hover{color:var(--alert);}

  /* ---------- 토스트 ---------- */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:13.5px;
    padding:11px 14px;border-radius:8px;display:flex;align-items:center;gap:14px;
    box-shadow:0 6px 20px rgba(27,36,54,.22);z-index:50;max-width:92vw;
  }
  .toast button{color:var(--hl-yellow);font-weight:700;font-size:13.5px;}
  .toast[hidden]{display:none;}

  @media (max-width:560px){
    body{padding:14px 10px 50px;}
    .add{grid-template-columns:1fr 1fr;padding:14px 16px;}
    .add #title{grid-column:1 / -1;}
    .top,.group,.foot{padding-left:16px;padding-right:16px;}
    .score-figure{font-size:38px;}
    .date{display:none;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>숙제 알리미</h1>
      <p class="sub" id="counts">불러오는 중…</p>
    </div>
    <div class="score" id="score">
      <span class="score-figure"><span id="pct">100</span><span class="unit">%</span></span>
      <p class="score-label">숙제를 해낼 확률</p>
    </div>
  </header>
  <div class="meter" id="meter"><i id="meterFill"></i></div>

  <section class="add">
    <input id="subject" placeholder="과목" maxlength="10" aria-label="과목">
    <input id="title" placeholder="숙제 내용" maxlength="60" aria-label="숙제 내용">
    <input id="due" type="date" aria-label="마감일">
    <button class="btn-add" id="addBtn">추가</button>
  </section>

  <main id="list"></main>

  <footer class="foot">
    <div class="foot-bar">
      <p class="stats" id="stats"></p>
      <button class="link" id="logToggle">기록 보기</button>
    </div>
    <div class="log" id="log" hidden></div>
  </footer>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(function(){
  const KEY = 'homework:v1';
  const PALETTE = [
    ['#FFE45E','#4A3A00'], ['#7FD9BE','#0E4437'], ['#FF9FB8','#6A1226'],
    ['#A9C7FF','#152F63'], ['#FFC48C','#5A2E00'], ['#D8BFFF','#3A1D66'],
    ['#B7E88C','#254A0C'], ['#9FE3E8','#0C4348']
  ];

  let state = { items: [], log: [] };
  let memoryOnly = false;
  let undoTimer = null;

  /* ---------- 날짜 ---------- */
  const fmt = d => d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
  const today = () => fmt(new Date());
  function dday(due){
    const a = new Date(today()+'T00:00:00');
    const b = new Date(due+'T00:00:00');
    return Math.round((b-a)/86400000);
  }
  function prettyDate(s){
    const d = new Date(s+'T00:00:00');
    const w = ['일','월','화','수','목','금','토'][d.getDay()];
    return (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + w + ')';
  }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

  /* ---------- 저장 ---------- */
  async function load(){
    if(!window.storage){ memoryOnly = true; return; }
    try{
      const r = await window.storage.get(KEY);
      if(r && r.value){
        const p = JSON.parse(r.value);
        state.items = Array.isArray(p.items) ? p.items : [];
        state.log   = Array.isArray(p.log)   ? p.log   : [];
      }
    }catch(e){ /* 첫 실행이면 저장된 값이 없음 */ }
  }
  async function save(){
    if(memoryOnly) return;
    try{
      const r = await window.storage.set(KEY, JSON.stringify(state));
      if(!r) toast('저장하지 못했어요. 다시 시도해 주세요.');
    }catch(e){ toast('저장하지 못했어요. 다시 시도해 주세요.'); }
  }

  /* ---------- 마감 지난 숙제 정리 ---------- */
  function sweep(){
    const t = today(), keep = [];
    let missed = 0;
    for(const it of state.items){
      if(it.due < t){
        state.log.unshift({ ...it, status:'missed', at:new Date().toISOString() });
        missed++;
      } else keep.push(it);
    }
    if(missed){ state.items = keep; save(); }
    return missed;
  }

  /* ---------- 확률 ---------- */
  function score(){
    const done = state.log.filter(l => l.status==='done').length;
    const miss = state.log.filter(l => l.status==='missed').length;
    const total = done + miss;
    return { done, miss, pct: total ? Math.round(done/total*100) : 100 };
  }

  function colorFor(subject){
    let h = 0;
    for(let i=0;i<subject.length;i++) h = (h*31 + subject.charCodeAt(i)) % 997;
    return PALETTE[h % PALETTE.length];
  }
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* ---------- 그리기 ---------- */
  function render(){
    const s = score();
    document.getElementById('pct').textContent = s.pct;
    const scoreEl = document.getElementById('score');
    const meterEl = document.getElementById('meter');
    scoreEl.className = 'score' + (s.pct>=85 ? '' : s.pct>=60 ? ' mid' : ' low');
    meterEl.className = 'meter' + (s.pct>=85 ? '' : s.pct>=60 ? ' mid' : ' low');
    document.getElementById('meterFill').style.width = s.pct + '%';

    const n = state.items.length;
    const todayN = state.items.filter(i => i.due === today()).length;
    document.getElementById('counts').textContent =
      n ? `남은 숙제 ${n}개 · 오늘까지 ${todayN}개` : '남은 숙제 없음';
    document.getElementById('stats').innerHTML =
      `해냄 <b>${s.done}</b> · 놓침 <b>${s.miss}</b>`;

    const list = document.getElementById('list');
    if(!n){
      list.innerHTML = `<div class="empty"><strong>등록된 숙제가 없어요</strong>과목과 할 일, 마감일을 적고 추가를 눌러보세요.</div>`;
      renderLog();
      return;
    }

    const sorted = [...state.items].sort((a,b) =>
      a.due === b.due ? a.created - b.created : a.due < b.due ? -1 : 1);
    const groups = [
      { key:'오늘 마감', test: d => d === 0 },
      { key:'내일',     test: d => d === 1 },
      { key:'이번 주',  test: d => d >= 2 && d <= 7 },
      { key:'그 뒤',    test: d => d > 7 }
    ];

    let html = '';
    for(const g of groups){
      const rows = sorted.filter(i => g.test(dday(i.due)));
      if(!rows.length) continue;
      html += `<section class="group"><h2>${g.key} <span>${rows.length}</span></h2><ul>`;
      for(const it of rows){
        const d = dday(it.due);
        const [bg, fg] = colorFor(it.subject);
        html += `<li class="row" data-id="${it.id}">
          <button class="check" data-act="done" aria-label="완료 처리"></button>
          <span class="tag" style="background:${bg};color:${fg}">${esc(it.subject)}</span>
          <span class="task">${esc(it.title)}</span>
          <span class="date">${prettyDate(it.due)}</span>
          <span class="dday${d<=1?' hot':''}">D-${d}</span>
          <button class="kill" data-act="del" aria-label="삭제" title="확률에 영향 없이 지우기">×</button>
        </li>`;
      }
      html += `</ul></section>`;
    }
    list.innerHTML = html;
    renderLog();
  }

  function renderLog(){
    const box = document.getElementById('log');
    if(box.hidden) return;
    if(!state.log.length){
      box.innerHTML = `<p class="log-empty">아직 기록이 없어요.</p>`;
      return;
    }
    let html = '';
    for(const l of state.log.slice(0,40)){
      const ok = l.status === 'done';
      html += `<div class="log-row">
        <span class="mark ${ok?'ok':'no'}">${ok?'해냄':'놓침'}</span>
        <span class="what">${esc(l.subject)} · ${esc(l.title)} · ${prettyDate(l.due)}</span>
      </div>`;
    }
    html += `<button class="reset" id="resetLog">기록 전부 지우고 확률 100%로 되돌리기</button>`;
    box.innerHTML = html;
    document.getElementById('resetLog').onclick = () => {
      state.log = []; save(); render();
      toast('기록을 지웠어요.');
    };
  }

  /* ---------- 토스트 ---------- */
  function toast(msg, undo){
    const el = document.getElementById('toast');
    clearTimeout(undoTimer);
    el.innerHTML = `<span>${esc(msg)}</span>`;
    if(undo){
      const b = document.createElement('button');
      b.textContent = '되돌리기';
      b.onclick = () => { undo(); el.hidden = true; };
      el.appendChild(b);
    }
    el.hidden = false;
    undoTimer = setTimeout(() => { el.hidden = true; }, undo ? 6000 : 3000);
  }

  /* ---------- 동작 ---------- */
  function add(){
    const su = document.getElementById('subject');
    const ti = document.getElementById('title');
    const du = document.getElementById('due');
    const subject = su.value.trim(), title = ti.value.trim(), due = du.value;
    if(!subject || !title || !due){
      toast('과목, 숙제 내용, 마감일을 모두 채워주세요.');
      (!subject ? su : !title ? ti : du).focus();
      return;
    }
    if(due < today()){ toast('마감일이 이미 지났어요.'); du.focus(); return; }
    state.items.push({ id:uid(), subject, title, due, created:Date.now() });
    save(); render();
    ti.value = '';
    ti.focus();
  }

  function done(id){
    const i = state.items.findIndex(x => x.id === id);
    if(i < 0) return;
    const it = state.items[i];
    const row = document.querySelector(`.row[data-id="${id}"]`);
    if(row) row.classList.add('done');
    setTimeout(() => {
      state.items.splice(i,1);
      state.log.unshift({ ...it, status:'done', at:new Date().toISOString() });
      save(); render();
      toast(`${it.subject} 숙제 완료!`, () => {
        state.log = state.log.filter(l => !(l.id === it.id && l.status === 'done'));
        state.items.push(it);
        save(); render();
      });
    }, 340);
  }

  function del(id){
    const i = state.items.findIndex(x => x.id === id);
    if(i < 0) return;
    const it = state.items[i];
    state.items.splice(i,1);
    save(); render();
    toast('숙제를 지웠어요. 확률은 그대로예요.', () => {
      state.items.push(it); save(); render();
    });
  }

  /* ---------- 이벤트 ---------- */
  document.getElementById('addBtn').onclick = add;
  ['subject','title','due'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if(e.key === 'Enter') add();
    });
  });
  document.getElementById('list').addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if(!btn) return;
    const id = btn.closest('.row').dataset.id;
    if(btn.dataset.act === 'done') done(id); else del(id);
  });
  const logToggle = document.getElementById('logToggle');
  logToggle.onclick = () => {
    const box = document.getElementById('log');
    box.hidden = !box.hidden;
    logToggle.textContent = box.hidden ? '기록 보기' : '기록 접기';
    renderLog();
  };

  /* ---------- 시작 ---------- */
  (async function init(){
    const du = document.getElementById('due');
    du.value = today(); du.min = today();
    await load();
    const missed = sweep();
    render();
    if(missed) toast(`마감이 지난 숙제 ${missed}개가 놓침으로 기록됐어요.`);
    if(memoryOnly) toast('이 환경에서는 저장이 안 돼서 새로고침하면 사라져요.');
    // 자정을 넘기거나 마감이 지나는 순간을 감지
    let last = today();
    setInterval(() => {
      const t = today();
      const m = sweep();
      if(m || t !== last){ last = t; render(); }
    }, 30000);
  })();
})();
</script>
</body>
</html>
