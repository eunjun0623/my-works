document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && !$('mode-list').hidden){ closeModeList(); return; }
  if(!$('dialog').hidden){
    if(Date.now()-dialogOpenedAt<250) return;
    if(e.key==='Enter'){ e.preventDefault(); var pr=$('dialog-btns').querySelector('.primary'); if(pr) pr.click(); }
    else if(e.key==='Escape'){ var btns=$('dialog-btns').querySelectorAll('button'); var last=btns[btns.length-1]; if(last) last.click(); }
    return;
  }
  if(!$('auth-modal').hidden){
    if(e.key==='Escape') closeAuth();
    else if(e.key==='Enter'){ e.preventDefault(); submitAuth(); }
    return;
  }
  if(!$('photo-modal').hidden){ if(e.key==='Escape') $('photo-modal').hidden=true; return; }
  if(!$('user-modal').hidden){ if(e.key==='Escape') $('user-modal').hidden=true; return; }
  if(!$('add-modal').hidden){ if(e.key==='Escape') closeAdd(); return; }
  var tag=(document.activeElement && document.activeElement.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA') return;
  if((e.key==='['||e.key===']') && activeSet && currentView!=='menu'){
    e.preventDefault(); switchMode(e.key==='['? -1 : 1); return;
  }
  if(currentView==='study'){
    if(e.key==='ArrowLeft'){ e.preventDefault(); pCard(); return; }
    if(e.key==='ArrowRight'){ e.preventDefault(); nCard(); return; }
    if(e.key===' '||e.code==='Space'){ e.preventDefault(); flipCard(); return; }
  }
  if(e.key==='q'||e.key==='Q'||e.key==='Escape'){
    if(['study','test','result','learn','speed','match','overview','spelling'].indexOf(currentView)!==-1) exitToMenu();
  }
});

var tStartX=0, tStartY=0, swiped=false;
var cardEl=$('card');
cardEl.addEventListener('touchstart', function(e){ var t=e.changedTouches[0]; tStartX=t.clientX; tStartY=t.clientY; swiped=false; }, {passive:true});
cardEl.addEventListener('touchend', function(e){
  var t=e.changedTouches[0]; var dx=t.clientX-tStartX, dy=t.clientY-tStartY;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){ swiped=true; if(dx<0) nCard(); else pCard(); }
}, {passive:true});
cardEl.addEventListener('click', function(){ if(swiped){ swiped=false; return; } flipCard(); });
cardEl.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); flipCard(); } });

/* =========================================================
   시작
   ========================================================= */
function waitForShared(ms){
  return new Promise(function(resolve){
    if(sharedApi()) return resolve(true);
    var waited=0;
    var t=setInterval(function(){
      waited+=200;
      if(sharedApi()){ clearInterval(t); resolve(true); }
      else if(waited>=ms){ clearInterval(t); resolve(false); watchLate(); }
    },200);
  });
}
function watchLate(){
  /* 그래도 나중에 붙으면 그때 다시 불러온다 */
  var tries=0;
  var t=setInterval(async function(){
    tries++;
    if(sharedApi()){
      clearInterval(t);
      var loaded=await Store.get(K_SETS);
      if(loaded && typeof loaded==='object' && !Array.isArray(loaded)) officialSets=loaded;
      notice=(await Store.get(K_NOTICE))||'';
      await restoreSession();
      renderAccountBar();
      if(currentView==='menu') showMenu();
    } else if(tries>60) clearInterval(t);
  },2000);
}
async function init(){
  allSets=loadJSON(DATA_KEY)||{};
  if(typeof allSets!=='object' || Array.isArray(allSets)) allSets={};
  progress=loadJSON(PROG_KEY)||{};
  if(typeof progress!=='object' || Array.isArray(progress)) progress={};

  $('add-ok').addEventListener('click', createCustomSet);
  $('add-cancel').addEventListener('click', closeAdd);
  $('btn-back').addEventListener('click', exitToMenu);
  $('btn-star').addEventListener('click', tapStar);
  setInterval(pollUnread, 25000);
  $('mode-btn').addEventListener('click', function(e){ e.stopPropagation(); toggleModeList(); });
  document.addEventListener('click', function(){ if(!$('mode-list').hidden) closeModeList(); });
  $('photo-close').addEventListener('click', function(){ $('photo-modal').hidden=true; });
  $('photo-modal').addEventListener('click', function(e){ if(e.target===$('photo-modal')) $('photo-modal').hidden=true; });
  $('auth-tab-login').addEventListener('click', function(){ openAuth('login'); });
  $('auth-tab-signup').addEventListener('click', function(){ openAuth('signup'); });
  $('auth-cancel').addEventListener('click', closeAuth);
  $('auth-ok').addEventListener('click', submitAuth);
  $('user-close').addEventListener('click', function(){ $('user-modal').hidden=true; });
  $('auth-modal').addEventListener('click', function(e){ if(e.target===$('auth-modal')) closeAuth(); });
  $('user-modal').addEventListener('click', function(e){ if(e.target===$('user-modal')) $('user-modal').hidden=true; });

  initVoices();
  renderAccountBar();
  showMenu();

  if(!SB) await waitForShared(6000);
  var loaded=await Store.get(K_SETS);
  if(loaded && typeof loaded==='object' && !Array.isArray(loaded)) officialSets=loaded;
  notice=(await Store.get(K_NOTICE))||'';
  await restoreSession();
  if(me && me.day!==todayStr()){ me.day=todayStr(); me.dayCount=0; me.missionDone=false; }
  if(!Object.keys(officialSets).length) setKind = Object.keys(allSets).length? 'mine':'official';
  renderAccountBar();
  if(currentView==='menu') showMenu();
}
init();
})();
