<style>
:root{
  --bg:#eef1f6; --card:#ffffff; --line:#e2e7ee; --ink:#1c2531; --muted:#6b7784;
  --blue:#20739b; --test:#e74c3c; --learn:#27ae60; --flash:#3498db; --plus:#2ca854;
  --ok:#2ecc71; --orange:#e67e22; --del:#ff4d4d; --create:#34a853; --gold:#d4a017;
}
*{box-sizing:border-box}
html,body{margin:0;background:
  radial-gradient(1100px 620px at 12% -8%, #dfeaf6 0%, rgba(223,234,246,0) 60%),
  radial-gradient(900px 520px at 92% 4%, #e6e2f7 0%, rgba(230,226,247,0) 55%),
  var(--bg);
  background-attachment:fixed;color:var(--ink);
  font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;
  -webkit-text-size-adjust:100%}
body{min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:0;border-radius:10px;color:inherit;
  transition:transform .14s cubic-bezier(.22,.61,.36,1), box-shadow .14s, background .14s, color .14s, border-color .14s}
button:hover:not(:disabled){transform:translateY(-2px)}
button:active:not(:disabled){transform:translateY(0) scale(.97)}
[role="button"],.set-card,.ov-cell,.mcard,.card{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid #f39c12;outline-offset:2px}
button:disabled{opacity:.5;cursor:default}

/* 계정 바 */
.accountbar{display:flex;align-items:center;justify-content:flex-start;gap:14px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:9px 16px;flex-wrap:wrap;
  position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:.01em;color:var(--ink)}
.brand img{width:26px;height:26px;border-radius:7px;display:block}
.who{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who .pt{color:var(--blue)}
.who .anon{color:var(--muted);font-weight:400}
.tag-admin{background:var(--gold);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;border:0;white-space:nowrap}
.chip.live{background:#e4f6ea;color:#1e7a42}
.chip.local{background:#fdeee0;color:#a75a12}
.acct-btns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}

/* 탭 */
.tabs{display:flex;gap:6px;justify-content:center;padding:10px 12px 0;flex-wrap:wrap}
.tab{background:rgba(255,255,255,.9);border:1px solid #d7dee7;font-size:13.5px;font-weight:700;
  padding:9px 18px;color:var(--muted);border-radius:999px}
.tab:hover{color:var(--ink);border-color:#b9c6d4}

/* 상단 */
.top{text-align:center;padding:12px 16px 6px}
h1{font-size:24px;margin:0 0 10px;font-weight:700;word-break:keep-all}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.mb{display:none}
.btn-primary{background:var(--blue);color:#fff;font-weight:700;font-size:15px;padding:11px 24px;border-radius:999px;
  box-shadow:0 6px 18px rgba(32,115,155,.28)}
.btn-primary:hover{box-shadow:0 10px 24px rgba(32,115,155,.36)}
.btn-ghost{background:rgba(255,255,255,.95);color:var(--blue);border:1px solid #d7dee7;font-size:13px;
  padding:7px 14px;font-weight:700;border-radius:999px}
.btn-ghost:hover{border-color:var(--blue);box-shadow:0 4px 12px rgba(32,115,155,.14)}

.btn-back{background:rgba(255,255,255,.95);border:1px solid #d7dee7;font-weight:700;font-size:13.5px;
  padding:9px 16px;border-radius:999px;box-shadow:0 2px 8px rgba(28,37,49,.06)}
.btn-back:hover{border-color:var(--blue);color:var(--blue)}
.topbar{max-width:1000px;margin:0 auto;padding:0 20px 4px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar[hidden],.mb-btn[hidden],.mb-list[hidden]{display:none}
.modebar{position:relative}
.mb-btn{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:999px;
  padding:7px 14px 7px 18px;box-shadow:0 8px 22px rgba(28,37,49,.22)}
.mb-btn:hover{box-shadow:0 12px 28px rgba(28,37,49,.32)}
.mb-mid{text-align:left;min-width:96px}
.mb-lbl{display:block;font-size:9.5px;letter-spacing:.14em;color:rgba(255,255,255,.6)}

.mb-caret{font-size:13px;color:rgba(255,255,255,.75);transition:transform .18s}
.mb-caret.up{transform:rotate(180deg)}
.mb-list{position:absolute;top:calc(100% + 8px);left:0;z-index:30;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:6px;min-width:210px;box-shadow:0 18px 44px rgba(28,37,49,.2);
  animation:popIn .16s cubic-bezier(.22,.61,.36,1)}
.mb-item{display:flex;align-items:center;gap:10px;width:100%;background:transparent;color:var(--ink);
  font-size:14.5px;font-weight:700;padding:11px 14px;text-align:left;border-radius:11px}
.mb-item:hover{background:#eef4f9;color:var(--blue);transform:none}
.mb-item .dot{width:8px;height:8px;border-radius:50%;background:#d7dee7;flex:none}
.mb-item.on{background:var(--blue);color:#fff}
.mb-item.on .dot{background:#fff}
.mb-item .sub{margin-left:auto;font-size:11px;font-weight:400;color:var(--muted)}
.mb-item.on .sub{color:rgba(255,255,255,.75)}

/* 본문 */
#con{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:10px 20px}
.view{display:none}.view.active{display:block}

/* 공지 */
.notice{background:#fff8e1;border:1px solid #f0d48a;border-radius:12px;padding:12px 16px;margin-bottom:14px;
  font-size:14px;line-height:1.6;white-space:pre-line;word-break:break-word}
.notice b{display:block;margin-bottom:4px;color:#9a7b12}

.btn-mini.give{background:#1f7a4d;color:#fff;border-color:#1f7a4d}
.btn-mini.give:hover{box-shadow:0 5px 14px rgba(31,122,77,.3)}
.gp-in{width:100%;font-size:20px;padding:12px 14px;border:2px solid var(--blue);border-radius:12px;
  font-family:inherit;text-align:center;margin-top:6px}
.gp-quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;justify-content:center}
.gp-note{font-size:14px;font-weight:700;color:var(--blue);text-align:center;margin:12px 0 0;min-height:20px}

/* 메시지 */
.tab.alert{border-color:var(--del);color:var(--del)}
.tab.alert.on{background:var(--del);color:#fff;border-color:var(--del);box-shadow:0 6px 16px rgba(192,57,43,.3)}
.dm-top{display:flex;justify-content:flex-end;margin-bottom:14px}
.dm-list{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 8px 26px rgba(28,37,49,.06)}
.dm-row{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:0;border-bottom:1px solid #eef1f5;
  padding:14px 16px;text-align:left;border-radius:0}
.dm-row:last-child{border-bottom:0}
.dm-row:hover{background:#f7fafd;transform:none}
.dm-row.un{background:#fff8ec}
.dm-row.un:hover{background:#fff2dc}
.dm-left{flex:1;min-width:0}
.dm-name{font-size:15px;font-weight:700}
.dm-prev{font-size:13px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.dm-time{font-size:11.5px;color:#9aa6b2}
.dm-badge{background:var(--del);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px}
.dm-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dm-head b{font-size:17px}
.dm-thread{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;
  height:52vh;min-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 8px 26px rgba(28,37,49,.06)}
.bub-wrap{display:flex;flex-direction:column;align-items:flex-start;max-width:76%}
.bub-wrap.mine{align-self:flex-end;align-items:flex-end}
.bub{background:#eef2f6;color:var(--ink);padding:10px 14px;border-radius:16px 16px 16px 5px;
  font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.bub-wrap.mine .bub{background:var(--blue);color:#fff;border-radius:16px 16px 5px 16px}
.bub-t{font-size:10.5px;color:#9aa6b2;margin-top:3px}
.dm-form{display:flex;gap:8px;margin-top:12px;align-items:flex-end}
.dm-form textarea{flex:1;font-family:inherit;font-size:15px;padding:11px 14px;border:1px solid #d7dee7;
  border-radius:14px;resize:none;line-height:1.5}
.dm-form textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 4px 14px rgba(32,115,155,.14)}
.dm-form button{flex:none;padding:12px 22px}

/* 출석 배너 */
.checkin{display:flex;align-items:center;gap:14px;background:linear-gradient(100deg,#1f7a4d,#2ca854);
  color:#fff;border-radius:18px;padding:14px 18px;margin-bottom:14px;flex-wrap:wrap;
  box-shadow:0 10px 26px rgba(44,168,84,.28)}
.checkin .ci-txt{flex:1;min-width:180px;font-size:15px;font-weight:700;line-height:1.5}
.checkin .ci-txt small{display:block;font-size:12.5px;font-weight:400;color:rgba(255,255,255,.85);margin-top:3px}
.btn-ci{background:#fff;color:#1f7a4d;font-weight:700;font-size:14.5px;padding:11px 22px;border-radius:999px}
.btn-ci:hover{box-shadow:0 8px 20px rgba(0,0,0,.18)}
.checkin.done{background:linear-gradient(100deg,#3b4655,#5a6676);box-shadow:0 10px 26px rgba(28,37,49,.18)}

/* 메뉴 도구줄 */
.menu-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.menu-bar input{order:-1}
.menu-bar input{flex:1;min-width:170px;font-size:15px;padding:11px 16px;border:1px solid #d7dee7;
  border-radius:999px;font-family:inherit;background:rgba(255,255,255,.95);transition:border-color .14s,box-shadow .14s}
.menu-bar input:focus{border-color:var(--blue);box-shadow:0 4px 14px rgba(32,115,155,.14);outline:none}
.psize{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.95);border:1px solid #d7dee7;
  border-radius:999px;padding:4px}
.psize span{font-size:11.5px;color:var(--muted);padding:0 6px 0 8px}
.psize button{font-size:13px;font-weight:700;color:var(--muted);padding:6px 11px;border-radius:999px;background:transparent}
.psize button:hover{color:var(--ink);transform:none;background:#eef2f6}
.psize button.on{background:var(--blue);color:#fff}

/* 별표 */
.btn-star{margin-left:auto;background:rgba(255,255,255,.95);border:1px solid #d7dee7;font-size:20px;line-height:1;
  width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#c3ccd6;box-shadow:0 2px 8px rgba(28,37,49,.06)}
.btn-star:hover{border-color:var(--gold);color:var(--gold)}
.btn-star.on{background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 6px 18px rgba(212,160,23,.34)}
.btn-star[hidden]{display:none}
.set-card.starset{background:linear-gradient(150deg,#fff8e6,#fff)}
.set-card.starset .set-name{color:#9a7b12}
.ov-cell{position:relative}
.ov-star{position:absolute;top:4px;right:6px;background:transparent;font-size:14px;color:#d3dae2;padding:2px 4px;line-height:1}
.ov-star:hover{color:var(--gold);transform:none}
.ov-star.on{color:var(--gold)}

/* 단어장 종류 전환 */
.seg{display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.seg button{background:rgba(255,255,255,.9);border:1px solid #d7dee7;font-size:13px;font-weight:700;
  padding:8px 16px;color:var(--muted);border-radius:999px}
.seg button:hover{color:var(--ink);border-color:#b9c6d4}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 6px 16px rgba(28,37,49,.24)}

/* 메뉴 */
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.set-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;min-height:172px;
  display:flex;align-items:center;justify-content:center;padding:26px 22px 30px;text-align:center;overflow:hidden;
  box-shadow:0 4px 18px rgba(28,37,49,.05);
  transition:transform .18s cubic-bezier(.22,.61,.36,1),box-shadow .18s,border-color .18s;
  -webkit-tap-highlight-color:transparent}
.set-card::before{content:'';position:absolute;inset:0 0 auto 0;height:5px;
  background:linear-gradient(90deg,var(--blue),#6ab0d0);opacity:0;transition:opacity .18s}
.set-card:hover{border-color:#c2d3e2;transform:translateY(-5px);box-shadow:0 16px 34px rgba(28,37,49,.13)}
.set-card:hover::before{opacity:1}
.set-name{font-size:20px;font-weight:700;word-break:break-all;line-height:1.35}
.set-sub{font-size:13.5px;color:#55606d;margin-top:6px;line-height:1.4;word-break:keep-all}
.set-count{font-size:12px;color:var(--muted);margin-top:8px}
.set-go{font-size:12.5px;font-weight:700;color:var(--blue);margin-top:14px;opacity:0;transform:translateY(6px);
  transition:opacity .18s,transform .18s}
.set-card:hover .set-go{opacity:1;transform:none}
.set-actions{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:4px}
.set-actions.right{left:auto;right:12px;align-items:flex-end}
.act.match{background:#8e44ad}.act.view{background:#16a085}.act.spell{background:#d35400}
.act{color:#fff;font-weight:700;font-size:12px;padding:5px 10px;border-radius:4px}
.act.test{background:var(--test)}.act.learn{background:var(--learn)}.act.flash{background:var(--flash)}
.act.speed{background:#8e44ad}
.set-del{position:absolute;bottom:6px;right:10px;background:transparent;color:var(--del);font-size:13px;font-weight:700;padding:4px 6px}
.set-badge{position:absolute;bottom:8px;left:14px;font-size:11px;font-weight:700;color:var(--gold)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 20px;font-size:16px;line-height:1.7;white-space:pre-line}

/* 하단 */
.bottom{display:flex;justify-content:center;align-items:center;gap:24px;padding:20px 16px 28px}
.btn-nav{background:rgba(255,255,255,.95);color:var(--blue);border:1px solid #d7dee7;font-weight:700;font-size:16px;
  padding:11px 24px;min-width:150px;border-radius:999px;box-shadow:0 3px 12px rgba(28,37,49,.06)}
.btn-nav:hover{border-color:var(--blue);box-shadow:0 8px 20px rgba(32,115,155,.18)}
.count{font-size:20px;font-weight:700;min-width:80px;text-align:center;white-space:nowrap}

/* 플래시 카드 */
.card{background:var(--card);border:1px solid var(--line);border-radius:32px;min-height:58vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:30px 40px;
  box-shadow:0 14px 40px rgba(28,37,49,.09);
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.card:hover{box-shadow:0 18px 46px rgba(28,37,49,.13)}
@keyframes slNext{from{opacity:0;transform:translateX(56px)}to{opacity:1;transform:none}}
@keyframes slPrev{from{opacity:0;transform:translateX(-56px)}to{opacity:1;transform:none}}
@keyframes flipIn{0%{transform:rotateX(72deg) scale(.97);opacity:.25}100%{transform:none;opacity:1}}
.card.sl-next{animation:slNext .3s cubic-bezier(.22,.61,.36,1)}
.card.sl-prev{animation:slPrev .3s cubic-bezier(.22,.61,.36,1)}
.card.fl{animation:flipIn .28s cubic-bezier(.22,.61,.36,1)}
.card .front{font-size:clamp(36px,9vw,64px);font-weight:700;word-break:break-word}
.card .back{font-size:clamp(26px,6.5vw,45px);font-weight:700;word-break:break-word}
.card .plus{font-size:clamp(18px,4vw,24px);font-weight:700;color:var(--plus);margin-top:22px}
.card .ex{font-size:clamp(16px,3.6vw,22px);color:#555;margin-top:34px;line-height:1.5;white-space:pre-line;max-width:100%}
.btn-say{background:#eef4f8;border:1px solid #cfd6dd;color:var(--blue);font-size:22px;
  width:52px;height:52px;border-radius:50%;margin-top:18px;line-height:1;display:flex;
  align-items:center;justify-content:center}
.btn-say:hover{background:#e0ebf2}
.btn-say.small{width:38px;height:38px;font-size:17px;margin:0}
.say-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px}

/* 문제 / 결과 */
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px 40px;text-align:center;
  box-shadow:0 10px 30px rgba(28,37,49,.07)}
.q-sub{font-size:15px;color:var(--muted);margin:0 0 10px}
.q-word{font-size:clamp(26px,7vw,34px);font-weight:700;margin:15px 0;word-break:break-word}
.q-sent{font-size:clamp(17px,4.5vw,22px);margin:12px 0;line-height:1.5;word-break:break-word}
.q-kor{font-size:13px;color:#888;margin:4px 0 8px}
.q-plus-lbl{font-size:14px;color:var(--plus);margin:5px 0}
.opt{display:block;width:100%;max-width:560px;margin:9px auto;background:#f7f9fc;border:1px solid #dde4ec;
  font-size:16px;padding:14px 16px;text-align:left;color:var(--ink);border-radius:12px}
.opt:hover{background:#eaf3fa;border-color:var(--blue);box-shadow:0 6px 16px rgba(32,115,155,.13)}
.q-listen{background:var(--blue);color:#fff;font-weight:700;font-size:16px;padding:12px 26px;border-radius:999px;
  display:block;margin:6px auto 12px;box-shadow:0 6px 18px rgba(32,115,155,.28)}
.ans-in{display:block;width:100%;max-width:420px;margin:15px auto;font-size:20px;text-align:center;padding:10px;
  border:1px solid #bbb;border-radius:8px;font-family:inherit}
.btn-submit{color:#fff;font-weight:700;font-size:14px;padding:10px 26px;background:var(--flash)}
.btn-submit.green{background:var(--learn)}
.result h2{font-size:28px;margin:10px 0}
.result .score{font-size:48px;font-weight:700;color:var(--ok);margin:10px 0}
.result .pct{font-size:32px;margin:5px 0 15px}
.btn-wrong{background:var(--orange);color:#fff;font-weight:700;font-size:15px;padding:12px 26px;margin:8px}
.btn-home{background:var(--flash);color:#fff;font-weight:700;font-size:15px;padding:12px 26px;margin:8px}

/* 획득 점수 표 */
.gain{max-width:420px;margin:14px auto 6px;text-align:left;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gain .g-row{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;font-size:14px;border-bottom:1px solid #eee}
.gain .g-row:last-child{border-bottom:0}
.gain .g-row.total{background:#f4f8fb;font-weight:700;font-size:16px}
.gain .g-row span:last-child{color:var(--blue);font-weight:700;white-space:nowrap}
.gain-none{font-size:13.5px;color:var(--muted);margin:14px 0 4px;line-height:1.6}

/* 콤보 */
.combo{font-size:14px;font-weight:700;color:var(--orange);margin:6px 0 0;min-height:20px}

/* 카드 맞추기 */
.match-top{display:flex;justify-content:center;gap:22px;margin-bottom:14px;flex-wrap:wrap;font-size:16px;font-weight:700}
.match-top span{color:var(--muted);font-weight:400;font-size:14px}
.match-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:820px;margin:0 auto}
.mcard{background:#fff;border:2px solid #cfd6dd;border-radius:14px;min-height:96px;display:flex;align-items:center;
  justify-content:center;text-align:center;padding:10px 8px;font-size:17px;font-weight:700;cursor:pointer;
  word-break:break-word;line-height:1.35;transition:transform .12s,background .12s,border-color .12s,box-shadow .12s;
  -webkit-tap-highlight-color:transparent}
.mcard.kor{font-size:15px;font-weight:400;color:#333}
.mcard{box-shadow:0 3px 10px rgba(28,37,49,.05)}
.mcard:hover{border-color:var(--blue);transform:translateY(-3px);box-shadow:0 10px 22px rgba(32,115,155,.16)}
.mcard.sel{border-color:var(--blue);background:#e8f3fa;transform:scale(1.06);box-shadow:0 6px 18px rgba(32,115,155,.28)}
.mcard.hit{animation:pop .42s ease forwards;pointer-events:none}
.mcard.bad{animation:shake .4s ease}
.mcard.gone{visibility:hidden}
@keyframes pop{
  0%{transform:scale(1.06);background:#d8f5e2;border-color:var(--ok)}
  45%{transform:scale(1.18);background:#c3f0d5;border-color:var(--ok)}
  100%{transform:scale(.5);opacity:0}
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px);border-color:var(--del);background:#ffecec}
  40%{transform:translateX(8px);border-color:var(--del);background:#ffecec}
  60%{transform:translateX(-6px);border-color:var(--del);background:#ffecec}
  80%{transform:translateX(6px)}
}

/* 한눈에 보기 */
.ov-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:900px;margin:0 auto}
.ov-cell{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:74px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:8px 6px;cursor:pointer;text-align:center;
  -webkit-tap-highlight-color:transparent;transition:transform .1s,border-color .1s}
.ov-cell{box-shadow:0 3px 10px rgba(28,37,49,.04)}
.ov-cell:hover{border-color:var(--blue);transform:translateY(-4px);box-shadow:0 12px 24px rgba(32,115,155,.16);color:var(--blue)}
.ov-cell b{font-weight:700;line-height:1.25;white-space:nowrap;max-width:100%;overflow:hidden;
  text-overflow:ellipsis;display:block}
.ov-cell b.w1{font-size:15.5px}
.ov-cell b.w2{font-size:13px}
.ov-cell b.w3{font-size:11.5px}
.ov-cell b.w4{font-size:10px;letter-spacing:-.02em}
.ov-cell i{font-size:11px;color:#aaa;font-style:normal;margin-top:4px}

/* 스펠링 연습 */
.sp-top{display:flex;justify-content:center;gap:18px;margin-bottom:8px;flex-wrap:wrap;font-size:15px;font-weight:700}
.sp-top .lv{color:var(--orange)}
.sp-top .life{color:var(--del);letter-spacing:2px}
.sp-field{position:relative;height:58vh;min-height:320px;background:#fff;border:1px solid var(--line);
  border-radius:14px;overflow:hidden}
.sp-line{position:absolute;left:0;right:0;bottom:0;height:3px;background:repeating-linear-gradient(90deg,#f3c2c2 0 10px,transparent 10px 20px)}
.drop{position:absolute;white-space:nowrap;padding:6px 12px;border-radius:20px;font-size:17px;font-weight:700;
  background:#eaf4fb;color:var(--blue);border:1px solid #bcd9ea;transform:translateX(-50%)}
.drop.kor{background:#fdf1e3;color:#a75a12;border-color:#f0d3ae;font-weight:400}
.drop.boom{animation:boom .3s ease forwards}
@keyframes boom{to{transform:translateX(-50%) scale(1.7);opacity:0}}
.sp-in{display:block;width:100%;max-width:420px;margin:14px auto 0;font-size:20px;text-align:center;padding:11px;
  border:2px solid var(--blue);border-radius:10px;font-family:inherit}
.sp-hint{text-align:center;font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.6}

/* 스피드 퀴즈 */
.timer{font-size:34px;font-weight:700;color:var(--test);margin:0 0 6px}
.timer.calm{color:var(--blue)}

/* 랭킹 */
.searchbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.searchbar input{flex:1;min-width:160px;font-size:15px;padding:9px 12px;border:1px solid #cfd6dd;border-radius:8px;font-family:inherit}
.rank-wrap{display:grid;grid-template-columns:266px 1fr;gap:18px;align-items:start}
.rank-right{min-width:0}
.tier-guide{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;
  box-shadow:0 8px 26px rgba(28,37,49,.06);position:sticky;top:72px}
.tier-guide h3{margin:0 0 12px;font-size:15px}
.tg-list{display:flex;flex-direction:column;gap:2px}
.tg-row{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:10px;transition:background .14s}
.tg-row.on{background:color-mix(in srgb, var(--tc) 12%, #fff);box-shadow:inset 0 0 0 1px var(--tc)}
.tg-dot{width:9px;height:9px;border-radius:50%;flex:none}
.tg-mid{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.tg-mid b{font-size:13px;font-weight:800}
.tg-mid span{font-size:11px;color:var(--muted)}
.tg-cum{font-size:12px;font-weight:700;color:#55606d;white-space:nowrap}
.tg-note{font-size:11.5px;color:var(--muted);line-height:1.6;margin:12px 0 0;white-space:pre-line}
.tg-me{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.tg-left{margin-left:auto;font-weight:700;color:#55606d}
.follow-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fcol h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:700}
.flist{display:flex;flex-direction:column;gap:5px;max-height:260px;overflow:auto}
.frow{display:flex;align-items:center;gap:8px;background:#f7f9fc;border:1px solid #e4eaf1;border-radius:11px;
  padding:9px 11px;text-align:left;width:100%}
.frow:hover{border-color:var(--blue);background:#eef5fa;transform:none}
.fname{font-size:13.5px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fnone{font-size:12.5px;color:var(--muted);margin:0}
.tier-badge{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;
  border:1px solid;letter-spacing:.01em;white-space:nowrap;line-height:1.5}
.tier-badge.big{font-size:15px;padding:6px 16px}
.tier-card{border-radius:18px;padding:20px;margin-bottom:14px;border:1px solid var(--line);background:#fff;
  box-shadow:0 8px 26px rgba(28,37,49,.06)}
.tier-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tier-top .now{font-size:22px;font-weight:800}
.tier-bar{height:12px;border-radius:999px;background:#eef1f5;overflow:hidden}
.tier-bar i{display:block;height:100%;border-radius:999px;transition:width .5s cubic-bezier(.22,.61,.36,1)}
.tier-info{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:7px;gap:10px;flex-wrap:wrap}
.rank-list{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 8px 26px rgba(28,37,49,.06)}
.rank-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid #eef1f5;
  transition:background .14s}
.rank-row:hover{background:#f7fafd}
.rank-row:last-child{border-bottom:0}
.rank-row.me{background:#eaf4fb}
.rk{font-size:17px;font-weight:700;min-width:44px;text-align:center;color:var(--muted)}
.rk.top1{color:#d4a017}.rk.top2{color:#8c9196}.rk.top3{color:#b3743a}
.rk-main{flex:1;min-width:0}
.rk-name{font-size:15.5px;font-weight:700;word-break:break-all;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rk-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.rk-pt{font-size:19px;font-weight:700;color:var(--blue);white-space:nowrap}
.btn-follow{background:#fff;border:1px solid var(--blue);color:var(--blue);font-size:12px;font-weight:700;padding:6px 12px}
.btn-follow.on{background:var(--blue);color:#fff}
.list-empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:15px;line-height:1.7;white-space:pre-line}

/* 프로필 */
.pcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;
  box-shadow:0 8px 26px rgba(28,37,49,.06)}
.pcard h3{margin:0 0 12px;font-size:16px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#f7f9fb;border-radius:10px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--blue)}
.stat span{font-size:12px;color:var(--muted)}
.rules{font-size:13.5px;line-height:1.9;color:#444;margin:0;padding-left:18px}
.rules li{word-break:keep-all}
.btn-check{background:var(--create);color:#fff;font-weight:700;font-size:15px;padding:11px 22px;width:100%}
.btn-check:disabled{background:#c8d2da}
.streak{font-size:13px;color:var(--muted);margin:8px 0 0;text-align:center}

/* 관리자 */
.admin-sec{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;
  box-shadow:0 8px 26px rgba(28,37,49,.06)}
.admin-sec h3{margin:0 0 6px;font-size:16px}
.admin-sec p.desc{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.6}
.mini-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #eee;border-radius:10px;margin-bottom:8px;flex-wrap:wrap}
.mini-row .nm{flex:1;font-weight:700;font-size:14.5px;min-width:120px;word-break:break-all}
.mini-row .mt{font-size:12.5px;color:var(--muted)}
.btn-mini{background:#eef2f6;font-size:12px;font-weight:700;padding:6px 11px}
.btn-mini.red{background:#ffecec;color:var(--del)}
.btn-mini.blue{background:#e6f1f7;color:var(--blue)}
.admin-note{font-size:12.5px;color:var(--muted);line-height:1.7;margin:10px 0 0}
.admin-ta{width:100%;height:90px;font-size:14px;padding:10px;border:1px solid #bbb;border-radius:8px;font-family:inherit;resize:vertical}

/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay[hidden]{display:none}
.modal{background:#fff;border-radius:20px;padding:24px 26px;width:100%;max-width:560px;
  box-shadow:0 24px 64px rgba(0,0,0,.28);max-height:95vh;overflow:auto;animation:popIn .2s cubic-bezier(.22,.61,.36,1)}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.modal h2{margin:0 0 12px;font-size:18px}
.modal label{display:block;font-size:14px;font-weight:700;margin-bottom:10px}
.modal input[type=text],.modal input[type=password]{display:block;width:100%;margin-top:6px;font-size:16px;padding:9px 10px;border:1px solid #bbb;border-radius:8px;font-family:inherit;font-weight:400}
.modal-note{font-size:13px;color:var(--muted);margin:0 0 8px;line-height:1.5}
.modal textarea{width:100%;height:240px;font-size:16px;padding:10px;border:1px solid #bbb;border-radius:8px;font-family:inherit;resize:vertical;line-height:1.5}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.btn-create{background:var(--create);color:#fff;font-weight:700;font-size:15px;padding:10px 18px}
.dialog p{font-size:16px;white-space:pre-line;line-height:1.6;margin:4px 0 6px;text-align:center;word-break:break-word}
.dialog .modal-btns{justify-content:center}
.btn-dlg{font-weight:700;font-size:15px;padding:10px 24px;min-width:96px;background:#e9edf1;color:var(--ink)}
.btn-dlg.primary{background:var(--blue);color:#fff}
.tabs-mini{display:flex;gap:8px;margin-bottom:12px}
.tabs-mini button{flex:1;background:#eef2f6;font-size:14px;font-weight:700;padding:9px}
.tabs-mini button.on{background:var(--blue);color:#fff}
.err{color:var(--del);font-size:13.5px;min-height:19px;margin:2px 0 0;line-height:1.5}

/* 사용자 상세 */
.udetail .stat-grid{grid-template-columns:repeat(2,1fr)}
.udetail h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* 모바일 */
@media (max-width:640px){
  h1{font-size:20px}
  .kb{display:none}.mb{display:inline}
  #con{padding:6px 12px}
  .menu-grid{grid-template-columns:1fr 1fr;gap:10px}
  .menu-bar{gap:8px}
  .psize span{display:none}
  .psize button{padding:6px 9px;font-size:12.5px}
  .btn-star{width:38px;height:38px;font-size:18px}
  .set-card{min-height:132px;padding:20px 16px 24px}
  .set-name{font-size:17px}
  .set-go{opacity:1;transform:none;margin-top:10px}
  .topbar{padding:0 12px 4px;gap:8px}
  .mb-mid{min-width:88px;padding:0 8px}
  .mb-mid b{font-size:13px}
  .btn-nav{min-width:0;flex:1;padding:12px 8px;font-size:15px}
  .bottom{gap:12px;padding:12px 12px 20px}
  .card{min-height:52vh;padding:24px 18px;border-radius:26px}
  .panel{padding:22px 16px}
  .btn-primary{font-size:14px;padding:10px 14px}
  .modal{padding:18px 16px}
  .modal textarea{height:200px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .follow-cols{grid-template-columns:1fr;gap:16px}
  .dm-thread{height:46vh;min-height:220px;padding:12px}
  .bub-wrap{max-width:86%}
  .dm-form button{padding:12px 16px}
  .tab{padding:8px 12px;font-size:13px}
  .brand span{display:none}
  .match-grid{gap:7px}
  .mcard{min-height:74px;font-size:14px;padding:6px 4px;border-radius:11px}
  .mcard.kor{font-size:12.5px}
  .ov-grid{gap:6px}
  .ov-cell{min-height:58px}
  .ov-cell b.w1{font-size:12.5px}
  .ov-cell b.w2{font-size:11px}
  .ov-cell b.w3{font-size:9.5px}
  .ov-cell b.w4{font-size:8.5px}
  .sp-field{height:48vh;min-height:260px}
  .drop{font-size:15px;padding:5px 10px}
  .rank-wrap{grid-template-columns:1fr;gap:12px}
  .tier-guide{position:static;padding:14px}
  .tg-row{padding:6px 6px;gap:8px}
  .rank-row{gap:8px;padding:10px 10px}
  .rk{min-width:34px;font-size:15px}
}
</style>

var SUPABASE_URL = 'https://wbvcinbrevhvqdiwundr.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndidmNpbmJyZXZodnFkaXd1bmRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1Nzk5MTQsImV4cCI6MjEwNDE1NTkxNH0.lVcbmT4berXUGZx2PnbwVXIYSYlhiyx97s9gLKfIVUo';

var SB = !!(SUPABASE_URL && SUPABASE_KEY);
function sbUrl(path){ return SUPABASE_URL.replace(/\/+$/,'')+'/rest/v1/'+path; }
function sbHeaders(extra){
  var h={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
  if(extra) Object.keys(extra).forEach(function(k){ h[k]=extra[k]; });
  return h;
}
var sbBroken=false;
async function sbFail(e){
  if(sbBroken) return;
  sbBroken=true;
  await alertBox('점수 서버에 연결하지 못했습니다.\n\n주소와 키가 맞는지, kv 표를 만들었는지 확인해 주세요.\n연결될 때까지는 이 기기 안에만 저장됩니다.');
}
function sharedApi(){
  if(SB) return 'supabase';
  try{
    var w=(typeof window!=='undefined')? window : null;
    if(w && w.storage && typeof w.storage.get==='function') return w.storage;
    if(w && w.parent && w.parent!==w && w.parent.storage && typeof w.parent.storage.get==='function') return w.parent.storage;
  }catch(e){}
  return null;
}
var Store = {
  get shared(){ return !!sharedApi(); },
  get: async function(key){
    if(SB){
      try{
        var res=await fetch(sbUrl('kv?key=eq.'+encodeURIComponent(key)+'&select=value'),
          {headers:sbHeaders({'Cache-Control':'no-cache'}), cache:'no-store'});
        if(!res.ok) throw 0;
        var j=await res.json();
        return (j && j.length)? j[0].value : null;
      }catch(e){ sbFail(e); return null; }
    }
    var SHARED=sharedApi();
    if(SHARED){
      try{ var r=await SHARED.get(key,true); return r? JSON.parse(r.value): null; }
      catch(e){ return null; }
    }
    try{ var s=localStorage.getItem('shared_'+key); return s? JSON.parse(s): null; }catch(e){ return null; }
  },
  set: async function(key,val){
    if(SB){
      try{
        var res=await fetch(sbUrl('kv?on_conflict=key'),{
          method:'POST',
          headers:sbHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}),
          body:JSON.stringify([{key:key, value:val}])
        });
        if(!res.ok) throw 0;
        return true;
      }catch(e){ sbFail(e); return false; }
    }
    var SHARED=sharedApi();
    if(SHARED){
      try{ await SHARED.set(key, JSON.stringify(val), true); return true; }
      catch(e){ return false; }
    }
    try{ localStorage.setItem('shared_'+key, JSON.stringify(val)); return true; }catch(e){ return false; }
  },
  del: async function(key){
    if(SB){
      try{
        var res=await fetch(sbUrl('kv?key=eq.'+encodeURIComponent(key)),{method:'DELETE',headers:sbHeaders()});
        return res.ok;
      }catch(e){ sbFail(e); return false; }
    }
    var SHARED=sharedApi();
    if(SHARED){ try{ await SHARED.delete(key,true); return true; }catch(e){ return false; } }
    try{ localStorage.removeItem('shared_'+key); return true; }catch(e){ return false; }
  },
  list: async function(prefix){
    if(SB){
      try{
        var res=await fetch(sbUrl('kv?key=like.'+encodeURIComponent(prefix+'*')+'&select=key'),
          {headers:sbHeaders({'Cache-Control':'no-cache'}), cache:'no-store'});
        if(!res.ok) throw 0;
        var j=await res.json();
        return (j||[]).map(function(r){ return r.key; });
      }catch(e){ sbFail(e); return []; }
    }
    var SHARED=sharedApi();
    if(SHARED){
      try{
        var r=await SHARED.list(prefix,true);
        var ks=(r&&r.keys)||[];
        return ks.map(function(k){ return typeof k==='string'? k : (k&&k.key)||''; }).filter(Boolean);
      }catch(e){ return []; }
    }
    var out=[];
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k && k.indexOf('shared_'+prefix)===0) out.push(k.slice(7));
    }
    return out;
  }
};

/* 이 기기 저장 */

}

function accuracyOf(u){ return u && u.total? Math.round(u.correct/u.total*100) : 0; }
var TIERS=[
  ['브론즈',      3000,'#a97142','#f3e6d8'],
  ['실버',        3500,'#7c8896','#e9edf1'],
  ['골드',        4000,'#c8971a','#faf0d4'],
  ['플래티넘',    4500,'#2f9e93','#dcf3f0'],
  ['다이아',      5000,'#2f8fd0','#ddeefb'],
  ['마스터',      6000,'#8e44ad','#f0e3f7'],
  ['그랜드마스터',7000,'#c0392b','#fbe2df'],
  ['챌린저',      8000,'#1a6b87','#daecf3'],
  ['레전드',      9000,'#e06a10','#fde8d5']
];
var TIER_MAX=150000;          /* 레전드 3 졸업 */
var TIER_EXTRA=9000;          /* 그 뒤 레전드 4,5,6... 한 칸 */

function tierOf(score){
  var s=Math.max(0, score||0), base=0;
  for(var i=0;i<TIERS.length;i++){
    var step=TIERS[i][1];
    for(var r=1;r<=3;r++){
      if(s < base+step){
        return {name:TIERS[i][0], num:r, color:TIERS[i][2], bg:TIERS[i][3],
                base:base, need:step, into:s-base, top:false};
      }
      base+=step;
    }
  }
  var last=TIERS[TIERS.length-1];
  var extra=Math.floor((s-TIER_MAX)/TIER_EXTRA);
  return {name:last[0], num:4+extra, color:last[2], bg:last[3],
          base:TIER_MAX+extra*TIER_EXTRA, need:TIER_EXTRA,
          into:(s-TIER_MAX)%TIER_EXTRA, top:true};
}
function tierLabel(score){ var t=tierOf(score); return t.name+' '+t.num; }
function tierBadge(score, big){
  var t=tierOf(score);
  var b=el('span','tier-badge'+(big?' big':''), t.name+' '+t.num);
  b.style.color=t.color; b.style.background=t.bg; b.style.borderColor=t.color;
  return b;
}

function rankPointOf(u){ return (u? u.score:0) + accuracyOf(u); }

var HINT_MENU='<span class="kb">플래시카드: ← → 스페이스  |  Q 또는 ESC: 홈으로</span><span class="mb">단어장을 누르면 플래시 카드가 시작됩니다</span>';

/* =========================================================
   계정
   ========================================================= */
function hashPw(s){
  var h=5381;
  for(var i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))>>>0; }
  var h2=52711;
  for(var j=s.length-1;j>=0;j--){ h2=((h2<<5)+h2+s.charCodeAt(j)*31)>>>0; }
  return h.toString(36)+'-'+h2.toString(36)+'-'+s.length;
}
function newUser(id,name,pw,admin){
  return {id:id, name:name, pw:hashPw(pw), score:0, correct:0, total:0, sessions:0,

          created:Date.now()};
}
function normalizeUser(u){
  if(!u) return null;
  u.score=u.score||0; u.correct=u.correct||0; u.total=u.total||0; u.sessions=u.sessions||0;
  u.follows=u.follows||[]; u.streak=u.streak||0; u.lastCheck=u.lastCheck||'';
  u.day=u.day||''; u.dayCount=u.dayCount||0; u.log=u.log||{}; u.admin=!!u.admin;
  return u;
}
async function loadUser(id){ return normalizeUser(await Store.get(K_USER+id)); }

}

  $('auth-id').value=''; $('auth-pw').value='';

function closeAuth(){ $('auth-modal').hidden=true; }

async function submitAuth(){
  var id=$('auth-id').value.trim();
  var pw=$('auth-pw').value;
  var err=$('auth-err');
  if(!id){ err.textContent='아이디를 입력하세요.'; return; }
  if(!/^[A-Za-z0-9가-힣_]{2,16}$/.test(id)){ err.textContent='아이디는 2~16자의 한글, 영문, 숫자, _ 만 쓸 수 있습니다.'; return; }
  if(pw.length<4){ err.textContent='비밀번호는 4자 이상으로 정해 주세요.'; return; }
  var key=id.toLowerCase();
  $('auth-ok').disabled=true;
  try{
    var found=await loadUser(key);
    if(authMode==='signup'){
      if(found){ err.textContent='중복 아이디입니다. 다른 아이디를 써 주세요.'; return; }
      var others=await allUsers();
      var dup=others.some(function(u){ return (u.name||'').toLowerCase()===key; });
      if(dup){ err.textContent='중복 아이디입니다. 다른 아이디를 써 주세요.'; return; }
      var isAdmin = (others.length===0);   /* 첫 가입자가 관리자 */
      me=newUser(key,id,pw,isAdmin);
      await saveMe();
      storeJSON(SESS_KEY,{id:key,pw:me.pw});
      closeAuth();
      renderAccountBar();
      await alertBox(isAdmin
        ? '가입 완료. '+id+'님은 관리자입니다.\n관리자 탭에서 공식 단어장을 추가할 수 있습니다.'
        : '가입 완료. 이제 시험과 학습 점수가 랭킹에 쌓입니다.');
      goTab('home');
    } else {
      if(!found){ err.textContent='없는 아이디입니다.'; return; }
      if(found.pw!==hashPw(pw)){ err.textContent='비밀번호가 맞지 않습니다.'; return; }
      me=found;
      storeJSON(SESS_KEY,{id:key,pw:me.pw});
      closeAuth();
      renderAccountBar();
      goTab(currentTab==='home'?'home':currentTab);
    }
  } finally { $('auth-ok').disabled=false; }
}
async function logout(){
  var ok=await confirmBox('로그아웃할까요?');

  me=null;

/* =========================================================
   점수 시스템
   - 시험/학습을 끝내면 그 회차 점수(백분율)가 누적 점수에 더해집니다.
     예) 시험 70점 → 누적 70, 이어서 학습 80점 → 누적 150
   - 랭킹 점수 = 누적 점수 + 전체 정답률
   - 같은 단어장, 같은 모드를 하루에 두 번째부터 하면 절반만 들어갑니다.
   ========================================================= */
function bonusRow(list,label,pt){ if(pt>0) list.push([label,pt]); }

async function awardSession(mode, setName, correctCnt, totalCnt, official, opt){
  opt=opt||{};
  if(!me || !official || !totalCnt) return null;
  var pct=Math.round(correctCnt/totalCnt*100);
  var today=todayStr();
  var logKey=mode+'|'+setName+'|'+today;
  var times=me.log[logKey]||0;
  var rows=[], gained=0;

  var mult = (mode==='learn')? 2.5 : 2;
  var base = Math.round(pct*mult*(times===0? 1 : 0.5));
  rows.push([(mode==='learn'?'학습 점수 ':'시험 점수 ')+pct+'점 × '+mult
             +(times===0? '' : ' (오늘 반복 50%)'), base]);
  gained+=base;

  if(pct===100 && times===0){ bonusRow(rows,'만점 보너스',50); gained+=50; }
  if(opt.bestCombo && opt.bestCombo>=3){
    var cb=Math.min(opt.bestCombo*2,40);
    bonusRow(rows,'최고 연속 정답 '+opt.bestCombo+'개 보너스',cb); gained+=cb;
  }

  /* 하루 미션: 하루 3회차 완료 시 한 번 */
  if(me.day!==today){ me.day=today; me.dayCount=0; me.missionDone=false; }
  me.dayCount++;
  if(me.dayCount===3 && !me.missionDone){
    me.missionDone=true; bonusRow(rows,'오늘의 미션 (3회차 완료)',50); gained+=50;
  }

  me.log[logKey]=times+1;
  me.score+=gained;
  me.correct+=correctCnt;
  me.total+=totalCnt;
  me.sessions++;
  trimLog();
  await saveMe();
  renderAccountBar();
  return {rows:rows, gained:gained, pct:pct};
}
function trimLog(){
  var keys=Object.keys(me.log);
  if(keys.length<=200) return;
  var today=todayStr(), yest=yesterdayStr(), fresh={};
  keys.forEach(function(k){ if(k.indexOf('|'+today)!==-1||k.indexOf('|'+yest)!==-1) fresh[k]=me.log[k]; });
  me.log=fresh;
}
async function awardFlat(label, pt, dedupeKey){
  if(!me || pt<=0) return null;
  if(dedupeKey){
    if(me.log[dedupeKey]) return null;
    me.log[dedupeKey]=1;
  }
  me.score+=pt;
  await saveMe();
  renderAccountBar();
  return {rows:[[label,pt]], gained:pt};
}
function gainBox(res){
  var box=el('div','gain');
  res.rows.forEach(function(r){
    var row=el('div','g-row');
    row.appendChild(el('span',null,r[0]));
    row.appendChild(el('span',null,'+'+r[1]));
    box.appendChild(row);
  });
  var t=el('div','g-row total');
  t.appendChild(el('span',null,'획득 점수'));
  t.appendChild(el('span',null,'+'+res.gained));
  box.appendChild(t);
  return box;
}

   ========================================================= */
var K_DM='dm:', K_DMP='dmp:';
var dmUnread=0, dmPeers=[], dmOpen=null, dmCache={};
var dmPoll=null, dmBusy=false, dmSig='';

function convKey(a,b){ return K_DM + [a,b].sort().join('|'); }
async function loadConv(a,b){
  var v=await Store.get(convKey(a,b));
  return Array.isArray(v)? v : [];
}
async function saveConv(a,b,arr){ await Store.set(convKey(a,b), arr); }
async function loadPeers(uid){
  var v=await Store.get(K_DMP+uid);
  return Array.isArray(v)? v : [];
}
async function addPeer(uid, other){
  var list=await loadPeers(uid);
  if(list.indexOf(other)===-1){ list.push(other); await Store.set(K_DMP+uid, list); }
}

async function sendDM(toId, text){
  if(!me || !text.trim()) return false;
  var msg={id:'m'+Date.now()+Math.random().toString(36).slice(2,6),
           from:me.id, to:toId, text:text.trim().slice(0,1000), ts:Date.now(), read:false};
  var conv=await loadConv(me.id, toId);
  conv.push(msg);
  if(conv.length>300) conv=conv.slice(conv.length-300);
  await saveConv(me.id, toId, conv);
  await addPeer(me.id, toId);
  await addPeer(toId, me.id);
  return true;
}

async function refreshUnread(){
  if(!me){ dmUnread=0; return; }
  var peers=await loadPeers(me.id);
  dmPeers=peers;
  var n=0;
  for(var i=0;i<peers.length;i++){
    var conv=await loadConv(me.id, peers[i]);
    dmCache[peers[i]]=conv;
    for(var j=0;j<conv.length;j++){
      if(conv[j].to===me.id && !conv[j].read) n++;
    }
  }
  dmUnread=n;
}

function convSig(conv){
  if(!conv || !conv.length) return '0';
  return conv.length+'|'+conv[conv.length-1].id;
}
function stopDmPoll(){ if(dmPoll){ clearInterval(dmPoll); dmPoll=null; } }
function startDmPoll(){
  stopDmPoll();
  dmPoll=setInterval(dmTick, 3500);
}
async function dmTick(){
  if(!me || currentView!=='dm'){ stopDmPoll(); return; }
  if(dmBusy) return;
  dmBusy=true;
  try{
    if(dmOpen){
      var conv=await loadConv(me.id, dmOpen);
      var sig=convSig(conv);
      if(sig!==dmSig){
        var box=$('dm-thread');
        var atBottom = !box || (box.scrollHeight-box.scrollTop-box.clientHeight < 60);
        var inp=$('dm-input');
        var keep = inp? inp.value : '';
        await openThread(dmOpen, keep, atBottom);
      }
    } else {
      var before=dmPeers.slice().join(',')+'#'+dmUnread;
      await refreshUnread();
      var after=dmPeers.slice().join(',')+'#'+dmUnread;
      var changed=(before!==after);
      if(!changed){
        for(var i=0;i<dmPeers.length;i++){
          var c=dmCache[dmPeers[i]]||[];
          if(convSig(c)!==(dmSigList[dmPeers[i]]||'')) { changed=true; break; }
        }
      }
      if(changed){ renderTabs(); drawDMList(); }
    }
  }catch(e){}
  dmBusy=false;
}
var dmSigList={};

async function pollUnread(){
  if(!me || currentView==='dm') return;
  try{
    var before=dmUnread;
    await refreshUnread();
    if(before!==dmUnread) renderTabs();
  }catch(e){}
}

async function showDM(){
  if(!me){ goTab('home'); return; }
  currentTab='dm'; currentView='dm';
  renderTabs(); showView('dm');

  panel.innerHTML='';
  panel.appendChild(el('div','list-empty','메시지를 불러오는 중입니다...'));
  await refreshUnread();
  renderTabs();
  dmOpen=null;
  drawDMList();
  startDmPoll();
}

function nameOfId(id){
  var u=rankCache.filter(function(x){ return x.id===id; })[0];
  return u? u.name : id;
}

async function drawDMList(){
  if(!rankCache.length){ try{ rankCache=await allUsers(); }catch(e){} }
  var panel=$('dm-panel'); panel.innerHTML='';

  var top=el('div','dm-top');
  var nb=el('button','btn-primary','＋ 새 메시지');
  nb.addEventListener('click', openNewDM);
  top.appendChild(nb);
  panel.appendChild(top);

  if(!dmPeers.length){
    panel.appendChild(el('div','list-empty','아직 주고받은 메시지가 없습니다.\n＋ 새 메시지로 먼저 말을 걸어 보세요.'));
    return;
  }
  dmSigList={};
  dmPeers.forEach(function(pid){ dmSigList[pid]=convSig(dmCache[pid]||[]); });
  var rows=dmPeers.map(function(pid){
    var conv=dmCache[pid]||[];
    var last=conv[conv.length-1];
    var unread=conv.filter(function(m){ return m.to===me.id && !m.read; }).length;
    return {pid:pid, last:last, unread:unread, ts:last? last.ts:0};
  }).sort(function(a,b){ return b.ts-a.ts; });

  var list=el('div','dm-list');
  rows.forEach(function(r){
    var row=el('button','dm-row'+(r.unread?' un':''));
    var left=el('div','dm-left');
    var nm=el('div','dm-name', nameOfId(r.pid));
    left.appendChild(nm);
    left.appendChild(el('div','dm-prev', r.last? (r.last.from===me.id?'나: ':'')+r.last.text : ''));
    row.appendChild(left);
    var right=el('div','dm-right');
    if(r.last) right.appendChild(el('div','dm-time', shortTime(r.last.ts)));
    if(r.unread) right.appendChild(el('span','dm-badge', String(r.unread)));
    row.appendChild(right);
    row.addEventListener('click', function(){ openThread(r.pid); });
    list.appendChild(row);
  });
  panel.appendChild(list);
}

function shortTime(ts){
  var d=new Date(ts), now=new Date();
  var p=function(n){ return (n<10?'0':'')+n; };
  if(d.toDateString()===now.toDateString()) return p(d.getHours())+':'+p(d.getMinutes());
  return (d.getMonth()+1)+'/'+d.getDate();
}

async function openThread(pid, keepText, toBottom){
  dmOpen=pid;
  if(!dmPoll) startDmPoll();
  var conv=await loadConv(me.id, pid);
  dmSig=convSig(conv);
  var changed=false;
  conv.forEach(function(m){ if(m.to===me.id && !m.read){ m.read=true; changed=true; } });
  if(changed) await saveConv(me.id, pid, conv);
  dmCache[pid]=conv;
  await refreshUnread(); renderTabs();

  var panel=$('dm-panel'); panel.innerHTML='';
  var head=el('div','dm-head');
  var back=el('button','btn-ghost','← 목록');
  back.addEventListener('click', async function(){
    dmOpen=null;
    await refreshUnread(); renderTabs(); drawDMList();
  });
  head.appendChild(back);
  head.appendChild(el('b',null, nameOfId(pid)));
  panel.appendChild(head);

  var box=el('div','dm-thread'); box.id='dm-thread';
  if(!conv.length) box.appendChild(el('div','list-empty','첫 메시지를 보내 보세요.'));
  conv.forEach(function(m){
    var w=el('div','bub-wrap'+(m.from===me.id?' mine':''));
    var b=el('div','bub', m.text);
    w.appendChild(b);
    w.appendChild(el('span','bub-t', shortTime(m.ts)));
    box.appendChild(w);
  });
  panel.appendChild(box);

  var form=el('div','dm-form');
  var inp=document.createElement('textarea');
  inp.id='dm-input'; inp.rows=2; inp.placeholder='메시지를 입력하세요';
  if(keepText) inp.value=keepText;
  inp.addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSend(pid); }
  });
  form.appendChild(inp);
  var sb=el('button','btn-primary','보내기');
  sb.addEventListener('click', function(){ doSend(pid); });
  form.appendChild(sb);
  panel.appendChild(form);

  setTimeout(function(){
    var t=$('dm-thread'); if(t && toBottom!==false) t.scrollTop=t.scrollHeight;
    var i=$('dm-input');
    if(i && document.activeElement!==i && !keepText) i.focus();
  },60);
}

async function doSend(pid){
  var inp=$('dm-input');
  if(!inp) return;
  var txt=inp.value;
  if(!txt.trim()) return;
  inp.value='';
  var ok=await sendDM(pid, txt);
  if(!ok){ inp.value=txt; await alertBox('메시지를 보내지 못했습니다.'); return; }
  await openThread(pid);
}

async function openNewDM(){

var STAR_SET='⭐ 별표 단어';
var starred=[];
function starPath(){ return 'quizlet_star_'+(me? me.id : 'guest'); }
function loadStars(){
  var v=loadJSON(starPath());
  starred = Array.isArray(v)? v : [];
}
function saveStars(){ storeJSON(starPath(), starred); }
function sameW(a,b){ return a && b && a.front===b.front && a.back===b.back; }
function isStarred(w){ return !!w && starred.some(function(x){ return sameW(x,w); }); }
function toggleStar(w){
  if(!w) return false;
  var i=-1;
  for(var k=0;k<starred.length;k++){ if(sameW(starred[k],w)){ i=k; break; } }
  if(i===-1) starred.push({front:w.front, back:w.back, plus:w.plus||'', ex_eng:w.ex_eng||'', ex_kor:w.ex_kor||''});
  else starred.splice(i,1);
  saveStars();
  return i===-1;
}
function wordsOf(name, official){
  if(name===STAR_SET) return starred;
  return (official? officialSets : allSets)[name] || [];
}

function splitTitle(name){
  var str=String(name).trim();
  /* 1순위: 두 칸 이상 띄어쓰기로 직접 나눈 경우 */
  var d=str.split(/\s{2,}/);
  if(d.length>1 && d[0].trim()) return {head:d[0].trim(), sub:d.slice(1).join(' ').trim()};
  /* 2순위: "UNIT 16 학교와 수업" 처럼 [글자+숫자] 뒤가 있으면 자동으로 나눔 */
  var m=str.match(/^([A-Za-z가-힣]+\s*\d+)\s+(\S.*)$/);
  if(m) return {head:m[1].trim(), sub:m[2].trim()};
  return {head:str, sub:''};
}
function niceName(name){ return String(name).replace(/\s{2,}/g,' · '); }

function numKey(name){
  var m=String(name).match(/\d+/g);
  return m? parseInt(m[0],10) : Number.MAX_SAFE_INTEGER;
}
function sortNames(names){
  /* 이름 속 첫 숫자 기준, 같으면 이름순 */
  return names.slice().sort(function(a,b){
    var d=numKey(a)-numKey(b);
    if(d!==0) return d;
    return a.localeCompare(b,'ko');
  });
}

function setToText(list){
  return (list||[]).map(function(w){
    return [w.front,w.back,w.plus||'',w.ex_eng||'',w.ex_kor||''].join(' / ').replace(/(\s*\/\s*)+$/,'');
  }).join('\n');
}
async function parseWords(raw){
  var words=[], lines=raw.split('\n');
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    if(!line) continue;
    var p=line.split('/');
    if(p.length>=2){
      words.push({front:p[0].trim(), back:p[1].trim(),
        plus:p.length>=3?p[2].trim():'', ex_eng:p.length>=4?p[3].trim():'', ex_kor:p.length>=5?p[4].trim():''});
    } else {
      await alertBox("슬래시(/) 구분을 확인하세요:\n'"+line+"'");
      return null;
    }
  }
  return words;
}
async function createCustomSet(){
  var setName=$('add-name').value.trim();
  if(!setName){ await alertBox('단어장 이름을 입력하세요.'); $('add-name').focus(); return; }
  var raw=$('add-text').value.trim();
  if(!raw){ await alertBox('단어를 한 줄 이상 입력하세요.'); $('add-text').focus(); return; }
  var words=await parseWords(raw);
  if(!words) return;
  if(!words.length){ await alertBox('단어를 한 줄 이상 입력하세요.'); return; }

  if(addTargetOfficial){
    if(editingOfficial && editingOfficial!==setName) delete officialSets[editingOfficial];
    if(editingOfficial){ officialSets[setName]=words; }
    else {
      for(var s=0;s<words.length;s+=25){
        var chunk=words.slice(s,s+25);
        var fname=s===0? setName : setName+'_'+(Math.floor(s/25)+1);
        var idx=1;
        while(fname in officialSets){ fname=setName+'_'+idx; idx++; }
        officialSets[fname]=chunk;
      }
    }
    await Store.set(K_SETS, officialSets);
    closeAdd();
    if(currentTab==='admin') showAdmin(); else drawMenu();
    await alertBox('공식 단어장을 저장했습니다. 모든 사용자에게 보입니다.');
    return;
  }
  for(var t=0;t<words.length;t+=25){
    var ch=words.slice(t,t+25);
    var nm=t===0? setName : setName+'_'+(Math.floor(t/25)+1);
    var k=1;
    while(nm in allSets){ nm=setName+'_'+k; k++; }
    allSets[nm]=ch;
  }
  saveData(); closeAdd(); setKind='mine'; showMenu();
}

var voicesReady=false;
function canSpeak(){ return typeof speechSynthesis!=='undefined' && typeof SpeechSynthesisUtterance!=='undefined'; }
function pickVoice(){
  if(!canSpeak()) return null;
  var vs=speechSynthesis.getVoices()||[];
  if(!vs.length) return null;
  var en=vs.filter(function(v){ return /^en(-|_|$)/i.test(v.lang||''); });
  if(!en.length) return null;
  var us=en.filter(function(v){ return /US/i.test(v.lang||''); });
  return (us[0]||en[0]);
}
function speak(text){
  if(!canSpeak() || !text) return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    var v=pickVoice();
    if(v) u.voice=v;
    u.lang=(v && v.lang)||'en-US';
    u.rate=0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function initVoices(){
  if(!canSpeak()) return;
  try{
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged=function(){ voicesReady=true; };
  }catch(e){}
}

/* =========================================================
   문제 만들기
   ========================================================= */
function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function makeBlankSentence(word){
  var ex=word.ex_eng||'';
  if(!ex) return null;
  var re=new RegExp(escapeRegex(word.front),'i');
  if(!re.test(ex)) return null;
  return ex.replace(re,'______');
}
function sameWord(a,b){
  return a.front===b.front && a.back===b.back && (a.plus||'')===(b.plus||'') &&
         (a.ex_eng||'')===(b.ex_eng||'') && (a.ex_kor||'')===(b.ex_kor||'');
}
function inWrong(w){ return wrongWords.some(function(x){ return sameWord(x,w); }); }
function padOthers(others){
  if(others.length<3){ var rep=others.concat(others,others); others=rep.slice(0,3); }
  return others;
}
function createQuestion(word,qType,allWords){
  var others, options;
  if(qType==='choice'){
    var direction=pick(['eng_to_kor','kor_to_eng']);
    var question, answer;
    if(direction==='eng_to_kor'){
      question=word.front; answer=word.back;
      others=allWords.filter(function(w){ return w.front!==word.front; }).map(function(w){ return w.back; });
    } else {
      question=word.back; answer=word.front;
      others=allWords.filter(function(w){ return w.front!==word.front; }).map(function(w){ return w.front; });
    }
    others=padOthers(others); shuffle(others);
    options=others.slice(0,3).concat([answer]); shuffle(options);
    return {type:'choice', direction:direction, question:question, answer:answer, options:options, word:word};
  }
  if(qType==='write'){ return {type:'write', question:word.back, answer:word.front, word:word}; }
  if(qType==='spell'){
    var kinds=['kor'];
    if(word.ex_eng && makeBlankSentence(word)) kinds.push('sent');
    if(canSpeak()) kinds.push('audio');
    var kind=pick(kinds);
    var qtext = kind==='sent'? makeBlankSentence(word) : (kind==='audio'? word.front : word.back);
    return {type:'spell', kind:kind, question:qtext, answer:word.front, word:word, ex_kor:word.ex_kor||''};
  }
  if(qType==='blank_choice'){
    var blanked=makeBlankSentence(word);
    if(!blanked) return null;
    others=allWords.filter(function(w){ return w.front!==word.front; }).map(function(w){ return w.front; });
    others=padOthers(others); shuffle(others);
    options=others.slice(0,3).concat([word.front]); shuffle(options);
    return {type:'blank_choice', question:blanked, answer:word.front, options:options, word:word, ex_kor:word.ex_kor||''};
  }
  if(qType==='blank_write'){
    var blanked2=makeBlankSentence(word);
    if(!blanked2) return null;
    return {type:'blank_write', question:blanked2, answer:word.front, word:word, ex_kor:word.ex_kor||''};
  }
  if(qType==='plus_write'){
    var plus=(word.plus||'').trim();
    if(!plus) return null;
    return {type:'plus_write', question:word.front, answer:plus, word:word};
  }
  return null;
}

function progName(name,official){ return (official?'o:':'m:')+name; }

async function startTest(name, wrongOnly, official){
  wrongOnly=!!wrongOnly;
  if(official===undefined) official=activeOfficial;
  var words=wordsOf(name, official);
  if(!words.length) return;
  if(!wrongOnly && words.length<4){ await alertBox('4지선다를 위해 단어가 최소 4개 이상 필요합니다.'); return; }

  var pn=progName(name,official), key='test_'+pn, restore=false;
  if(!wrongOnly && key in progress) restore=await askContinue('시험');

  currentView='test'; activeSet=name; activeOfficial=!!official;
  if(!wrongOnly) setMode('test');
  isWrongNote=wrongOnly; isLearnMode=false; isSpellTest=false; combo=0; bestCombo=0;

  if(restore){
    var p=progress[key];
    testQuestions=p.questions||[]; testIndex=p.index||0; testScore=p.score||0;
    wrongWords=p.wrong_words||[]; bestCombo=p.best_combo||0;
  } else {
    testQuestions=[]; testIndex=0; testScore=0;
    var source=wrongOnly? wrongWords.slice() : words;
    if(!wrongOnly) wrongWords=[];
    for(var i=0;i<source.length;i++){
      var q=createQuestion(source[i], pick(['choice','write']), words);
      if(q) testQuestions.push(q);
    }
    if(!testQuestions.length){ await alertBox('문제가 없습니다.'); exitToMenu(); return; }
    shuffle(testQuestions);
    if(!wrongOnly) clearProgress('test',pn);
  }
  testTotal=testQuestions.length;
  enterQuestionMode(wrongOnly?'오답 노트':'시험');
}

    var p=progress[key];
    testQuestions=p.questions||[]; testIndex=p.index||0; testScore=p.score||0;
    wrongWords=p.wrong_words||[]; bestCombo=p.best_combo||0;
  } else {
    testQuestions=[]; testIndex=0; testScore=0; wrongWords=[];
    var allTypes=['choice','write','blank_choice','blank_write','plus_write'];
    for(var i=0;i<words.length;i++){
      var possible=[];
      for(var t=0;t<allTypes.length;t++){
        var q=createQuestion(words[i], allTypes[t], words);
        if(q) possible.push(q);
      }
      if(possible.length){ shuffle(possible); testQuestions=testQuestions.concat(possible.slice(0,2)); }
    }
    if(!testQuestions.length){ await alertBox('출제할 문제가 없습니다.'); exitToMenu(); return; }
    shuffle(testQuestions);
    clearProgress('learn',pn);
  }
  testTotal=testQuestions.length;
  enterQuestionMode('학습하기');
}

async function checkAnswer(selected){
  if(answering) return;
  answering=true;
  var q=testQuestions[testIndex];
  var correct;
  if(q.type==='choice'||q.type==='blank_choice'){
    correct=(selected===q.answer);
  } else {
    var inp=$('entry-answer');
    var userAns=(inp? inp.value:'').trim();
    correct=userAns.toLowerCase()===q.answer.toLowerCase();
  }
  if(correct){
    testScore++;
    combo++; if(combo>bestCombo) bestCombo=combo;
    await alertBox(combo>=3? ('정답입니다! ✅  '+combo+'연속!') : '정답입니다! ✅');
  } else {
    combo=0;
    await alertBox('오답입니다.\n정답: '+q.answer);
    if(!isLearnMode && !inWrong(q.word)) wrongWords.push(q.word);
    if(isLearnMode) requeueWrong(q);
  }
  testIndex++;
  showTestQuestion();
}

function requeueWrong(wrongQ){
  var word=wrongQ.word, allWords=curList();
  var candidates=['choice','write','blank_choice','blank_write','plus_write'].filter(function(t){ return t!==wrongQ.type; });
  shuffle(candidates);
  var newQ=null;
  for(var i=0;i<candidates.length;i++){ newQ=createQuestion(word,candidates[i],allWords); if(newQ) break; }
  if(newQ){
    var pos=Math.min(testIndex+randInt(5,9), testQuestions.length);
    testQuestions.splice(pos,0,newQ);
  }
}

function stopMatch(){ if(matchTimer){ clearInterval(matchTimer); matchTimer=null; } }

async function startMatch(name, official){
  var words=wordsOf(name, official);
  if(words.length<6){ await alertBox('카드 맞추기는 단어가 6개 이상 필요합니다.'); return; }
  currentView='match'; activeSet=name; activeOfficial=!!official; setMode('match');
  var six=shuffle(words.slice()).slice(0,6);
  matchCards=[];
  six.forEach(function(w,i){
    matchCards.push({pair:i, kind:'eng', text:w.front, out:false});
    matchCards.push({pair:i, kind:'kor', text:w.back, out:false});
  });
  shuffle(matchCards);
  matchSel=null; matchLock=false; matchTries=0; matchLeft=6; matchStart=Date.now();
  showView('match');
  setHeader('카드 맞추기: '+niceName(name),'<span class="kb">같은 뜻의 카드 두 장을 눌러 없애세요</span><span class="mb">같은 뜻 두 장을 터치하세요</span>',false,true);
  setNav(false); $('lbl-count').textContent='';
  drawMatch();
  stopMatch();
  matchTimer=setInterval(function(){
    var t=$('match-time');
    if(t) t.textContent=((Date.now()-matchStart)/1000).toFixed(1)+'초';
  },100);
}

function drawMatch(){
  var panel=$('match-panel'); panel.innerHTML='';
  var top=el('div','match-top');
  var t=el('div',null,'0.0초'); t.id='match-time';
  top.appendChild(t);
  var l=el('div',null,'남은 짝 '+matchLeft+'쌍'); l.id='match-left';
  top.appendChild(l);
  var a=el('div','', ''); a.id='match-try';
  a.appendChild(el('span',null,'시도 '+matchTries+'회'));
  top.appendChild(a);
  panel.appendChild(top);

  var grid=el('div','match-grid'); grid.id='match-grid';
  matchCards.forEach(function(c,i){
    var d=el('div','mcard'+(c.kind==='kor'?' kor':'')+(c.out?' gone':''), c.text);
    d.setAttribute('data-i', String(i));
    d.addEventListener('click', function(){ tapMatch(i); });
    grid.appendChild(d);
  });
  panel.appendChild(grid);
}
function matchNode(i){ return document.querySelector('.mcard[data-i="'+i+'"]'); }

function tapMatch(i){
  if(matchLock) return;
  var c=matchCards[i];
  if(!c || c.out) return;
  var node=matchNode(i);
  if(matchSel===i){ matchSel=null; node.classList.remove('sel'); return; }
  if(matchSel===null){ matchSel=i; node.classList.add('sel'); return; }

  var a=matchCards[matchSel], aNode=matchNode(matchSel);
  matchTries++;
  var tri=$('match-try'); if(tri) tri.innerHTML='<span>시도 '+matchTries+'회</span>';

  if(a.pair===c.pair && a.kind!==c.kind){
    a.out=true; c.out=true; matchLeft--;
    aNode.classList.remove('sel');
    aNode.classList.add('hit'); node.classList.add('hit');
    var lf=$('match-left'); if(lf) lf.textContent='남은 짝 '+matchLeft+'쌍';
    matchSel=null;
    setTimeout(function(){
      if(aNode) aNode.classList.add('gone');
      if(node) node.classList.add('gone');
    },420);
    if(matchLeft===0) setTimeout(finishMatch,520);
  } else {
    matchLock=true;
    aNode.classList.add('bad'); node.classList.add('bad');
    setTimeout(function(){
      aNode.classList.remove('bad','sel'); node.classList.remove('bad');
      matchSel=null; matchLock=false;
    },420);
  }
}

async function finishMatch(){
  stopMatch();
  if(currentView!=='match') return;
  currentView='result';
  var secs=(Date.now()-matchStart)/1000;
  var acc=Math.round(6/Math.max(matchTries,6)*100);

  setHeader('카드 맞추기 결과','',false,true);

  panel.appendChild(el('div','pct','시도 '+matchTries+'회 · 정확도 '+acc+'%'));

  if(me && activeOfficial){
    var rows=[['완료 보너스',15]], gained=15;
    var accPt=Math.round(acc*0.2);
    rows.push(['정확도 '+acc+'%',accPt]); gained+=accPt;
    var spPt=Math.max(0, Math.min(20, Math.round((60-secs)*0.4)));
    if(spPt>0){ rows.push(['속도 보너스 ('+secs.toFixed(1)+'초)',spPt]); gained+=spPt; }
    me.score+=gained; me.correct+=6; me.total+=matchTries; me.sessions++;
    await saveMe(); renderAccountBar();
    panel.appendChild(gainBox({rows:rows, gained:gained}));
    panel.appendChild(el('p','gain-none','누적 점수 '+me.score+'점  |  랭킹 점수 '+rankPointOf(me)+'점'));
  } else if(!me){
    panel.appendChild(el('p','gain-none','로그인하면 카드 맞추기 기록도 점수로 쌓입니다.'));
  } else {
    panel.appendChild(el('p','gain-none','내 단어장은 연습용이라 점수에 반영되지 않습니다.'));
  }
  var again=el('button','btn-wrong','한 번 더');
  again.addEventListener('click', function(){ startMatch(activeSet, activeOfficial); });
  panel.appendChild(again);
  var h=el('button','btn-home','홈으로 돌아가기');
  h.addEventListener('click', exitToMenu);
  panel.appendChild(h);
  $('lbl-count').textContent='';
}

function spSpeed(){ return 0.10 + spLevel*0.035; }        /* %/틱 */
function spInterval(){ return Math.max(900, 3600 - spLevel*260); }

function spTick(){
  if(currentView!=='spelling'){ stopSpelling(); return; }
  var field=$('sp-field');
  if(!field) return;

  var now=Date.now();
  if(now-spSpawn > spInterval()){ spSpawn=now; spAdd(field); }

  for(var i=spDrops.length-1;i>=0;i--){
    var d=spDrops[i];
    d.y+=spSpeed();
    if(d.node) d.node.style.top=d.y+'%';
    if(d.y>=92){
      if(d.node && d.node.parentNode) d.node.parentNode.removeChild(d.node);
      spDrops.splice(i,1);
      spMiss++; spLives--;
      var lf=$('sp-life'); if(lf) lf.textContent='♥♥♥♥♥'.slice(0,Math.max(spLives,0))||'—';
      if(spLives<=0){ finishSpelling(); return; }
    }
  }
}
function spAdd(field){
  var w=pick(spWords);
  var askKor = Math.random()<0.5;
  var d={ answer:w.front.toLowerCase(), y:-6, node:null };
  var node=el('div','drop'+(askKor?' kor':''), askKor? w.back : w.front);
  node.style.left=(12+Math.random()*76)+'%';
  node.style.top='-6%';
  field.appendChild(node);
  d.node=node;
  spDrops.push(d);
}
function spCheck(){
  var inp=$('sp-input');
  if(!inp) return;
  var v=inp.value.trim().toLowerCase();
  if(!v) return;
  for(var i=0;i<spDrops.length;i++){
    if(spDrops[i].answer===v){
      var d=spDrops.splice(i,1)[0];
      if(d.node){
        d.node.classList.add('boom');
        (function(n){ setTimeout(function(){ if(n.parentNode) n.parentNode.removeChild(n); },300); })(d.node);
      }
      inp.value='';
      spHit++;
      var sc=$('sp-score'); if(sc) sc.textContent='맞힘 '+spHit;
      if(spHit % 5 === 0){
        spLevel++;
        var lv=$('sp-level'); if(lv) lv.textContent='레벨 '+spLevel;
      }
      return;
    }
  }
}
async function finishSpelling(){
  stopSpelling();
  if(currentView!=='spelling') return;
  currentView='result';
  var mins=Math.max((Date.now()-spStart)/60000, 0.1);
  var wpm=Math.round(spHit/mins);
  var acc=Math.round(spHit/Math.max(spHit+spMiss,1)*100);
  showView('result');
  setHeader('스펠링 연습 결과','',false,true);
  var panel=$('result-panel'); panel.innerHTML='';
  panel.appendChild(el('h2',null,'스펠링 연습 종료'));
  panel.appendChild(el('div','score',spHit+'개 성공'));
  panel.appendChild(el('div','pct','레벨 '+spLevel+' · 정확도 '+acc+'% · 분당 '+wpm+'개'));

  if(me && activeOfficial){
    var rows=[], gained=0;
    var basePt=spHit*3; rows.push(['성공 '+spHit+'개 × 3점',basePt]); gained+=basePt;
    var lvPt=Math.min(spLevel*4, 40); rows.push(['도달 레벨 '+spLevel,lvPt]); gained+=lvPt;
    if(acc>=90){ var aPt=Math.round((acc-85)*0.6); rows.push(['정확도 '+acc+'%',aPt]); gained+=aPt; }
    if(wpm>=18){ var wPt=Math.min(15, wpm-15); rows.push(['속도 보너스 (분당 '+wpm+'개)',wPt]); gained+=wPt; }
    me.score+=gained; me.correct+=spHit; me.total+=(spHit+spMiss); me.sessions++;
    await saveMe(); renderAccountBar();
    panel.appendChild(gainBox({rows:rows, gained:gained}));
    panel.appendChild(el('p','gain-none','누적 점수 '+me.score+'점  |  랭킹 점수 '+rankPointOf(me)+'점'));
  } else if(!me){
    panel.appendChild(el('p','gain-none','로그인하면 스펠링 연습 점수도 랭킹에 쌓입니다.'));
  } else {
    panel.appendChild(el('p','gain-none','내 단어장은 연습용이라 점수에 반영되지 않습니다.'));
  }
  var again=el('button','btn-wrong','한 번 더');
  again.addEventListener('click', function(){ startSpelling(activeSet, activeOfficial); });
  panel.appendChild(again);
  var h=el('button','btn-home','홈으로 돌아가기');
  h.addEventListener('click', exitToMenu);
  panel.appendChild(h);
}

function paintFilter(b,on){
  b.style.background = on? 'var(--blue)':'#fff';
  b.style.color = on? '#fff':'var(--blue)';
}
function drawRank(){
  var panel=$('rank-holder');
  if(!panel) return;
  panel.innerHTML='';

  var sorted=rankCache.slice().sort(function(a,b){
    var d=rankPointOf(b)-rankPointOf(a);
    if(d!==0) return d;
    return (b.correct||0)-(a.correct||0);
  });
  sorted.forEach(function(u,i){ u._rank=i+1; });

  var view=sorted.filter(function(u){
    if(rankQuery && u.name.toLowerCase().indexOf(rankQuery.toLowerCase())===-1) return false;
    if(rankFilter==='follow'){
      if(!me) return false;
      if(u.id!==me.id && me.follows.indexOf(u.id)===-1) return false;
    }
    if(rankFilter==='follower'){
      if(!me) return false;
      if(u.id===me.id) return true;
      if(!u.follows || u.follows.indexOf(me.id)===-1) return false;
    }
    return true;
  });

  var list=el('div','rank-list');
  if(!view.length){
    list.appendChild(el('div','list-empty', rankCache.length
      ? (rankFilter==='follower'? '아직 나를 팔로우한 사람이 없습니다.'
         : (rankFilter==='follow'? '아직 팔로우한 사람이 없습니다.' : '조건에 맞는 사용자가 없습니다.'))
      : '아직 랭킹에 오른 사람이 없습니다.\n회원가입하고 공식 단어장을 풀면 첫 번째가 됩니다.'));
  }
  view.forEach(function(u){
    var row=el('div','rank-row'+(me&&u.id===me.id?' me':''));
    var rk=el('div','rk'+(u._rank<=3? ' top'+u._rank:''), u._rank+'위');
    var main=el('div','rk-main');
    var nm=el('div','rk-name');
    nm.appendChild(el('span',null,u.name));
    if(u.admin) nm.appendChild(el('span','tag-admin','관리자'));
    if(me&&u.id===me.id) nm.appendChild(el('span','rk-sub','(나)'));
    main.appendChild(nm);
    main.appendChild(el('div','rk-sub','누적 '+u.score+'점 · 정답률 '+accuracyOf(u)+'% · '+(u.sessions||0)+'회 · 팔로워 '+followersOf(u.id,rankCache)+'명'));
    row.appendChild(rk); row.appendChild(main);
    row.appendChild(el('div','rk-pt',rankPointOf(u)));
    if(me && u.id!==me.id){
      var on=me.follows.indexOf(u.id)!==-1;
      var fb=el('button','btn-follow'+(on?' on':''), on?'팔로잉':'팔로우');
      fb.addEventListener('click', function(e){ e.stopPropagation(); toggleFollow(u.id); });
      row.appendChild(fb);
    }
    main.style.cursor='pointer';
    main.addEventListener('click', function(){ openUser(u.id); });
    list.appendChild(row);
  });
  panel.appendChild(list);

  if(!me){
    var note=el('p','admin-note','랭킹은 누구나 볼 수 있습니다. 내 점수를 올리려면 로그인하세요.');
    note.style.textAlign='center';
    panel.appendChild(note);
  }
}
async function toggleFollow(id){
  if(!me) return;
  var i=me.follows.indexOf(id);
  if(i===-1) me.follows.push(id); else me.follows.splice(i,1);
  await saveMe();
  var mine=rankCache.filter(function(u){ return u.id===me.id; })[0];
  if(mine) mine.follows=me.follows.slice();
  drawRank();
}

function fileToJpegB64(file, maxSide){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file);
    var img=new Image();
    img.onload=function(){
      var w=img.width, h=img.height;
      var sc=Math.min(1, maxSide/Math.max(w,h));
      var c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(w*sc)); c.height=Math.max(1,Math.round(h*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      try{ resolve(c.toDataURL('image/jpeg',0.82).split(',')[1]); }
      catch(e){ reject(new Error('이미지를 변환하지 못했습니다.')); }
    };
    img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error('이미지를 열 수 없습니다.')); };
    img.src=url;
  });
}

async function photoToWords(files, onStatus){
  var key=getApiKey();
  if(!key) throw new Error('API 키를 먼저 넣어 주세요.');
  onStatus('사진을 줄이는 중...');
  var content=[];
  for(var i=0;i<files.length;i++){
    var b64=await fileToJpegB64(files[i],1568);
    content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}});
  }
  content.push({type:'text',text:PHOTO_PROMPT});
  onStatus('사진을 읽는 중입니다. 30초쯤 걸릴 수 있어요...');
  var res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key':key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body:JSON.stringify({model:'claude-sonnet-5',max_tokens:4000,messages:[{role:'user',content:content}]})
  });
  var data=await res.json();
  if(!res.ok){
    var m=(data && data.error && data.error.message)||'요청이 거부되었습니다.';
    throw new Error(m);
  }
  var text=(data.content||[]).map(function(b){ return b.type==='text'? b.text:''; }).join('\n').trim();
  if(!text) throw new Error('사진에서 단어를 찾지 못했습니다.');
  return text;
}

function openPhotoModal(){
  var body=$('photo-body'); body.innerHTML='';
  var canOfficial=!!(me && me.admin);

  body.appendChild(el('p','modal-note',
    '교재 페이지를 찍은 사진을 올리면 [단어 / 뜻 / 플러스단어 / 예문] 줄로 바꿔 줍니다. '
    +(canOfficial? '만든 뒤에 공식 단어장으로 넣을지 내 단어장으로 넣을지 고를 수 있습니다.'
                 : '결과는 내 단어장으로 들어갑니다.')
    +' 바로 저장되지 않으니 확인하고 고친 뒤에 저장하세요.'));

  var kl=el('label',null,'Anthropic API 키');
  var ki=document.createElement('input');
  ki.type='password'; ki.placeholder='sk-ant-...'; ki.value=getApiKey();
  kl.appendChild(ki);
  body.appendChild(kl);
  body.appendChild(el('p','modal-note','키는 이 브라우저에만 저장되고 다른 사람에게 보이지 않습니다. console.anthropic.com 에서 발급받을 수 있고, 사진을 읽을 때마다 소액의 요금이 듭니다.'));

  var fi=document.createElement('input');
  fi.type='file'; fi.accept='image/*'; fi.multiple=true; fi.hidden=true;
  body.appendChild(fi);

  var status=el('p','admin-note','');
  var go=el('button','btn-create','📷 사진 고르기 (여러 장 가능)');
  go.style.width='100%';
  go.addEventListener('click', function(){
    var k=ki.value.trim();
    if(!k){ alertBox('API 키를 먼저 넣어 주세요.'); ki.focus(); return; }
    setApiKey(k);
    fi.click();
  });
  body.appendChild(go);
  body.appendChild(status);

  fi.addEventListener('change', async function(e){
    var files=Array.prototype.slice.call(e.target.files||[]);
    e.target.value='';
    if(!files.length) return;
    if(files.length>8){ await alertBox('한 번에 8장까지만 올릴 수 있습니다.'); return; }
    go.disabled=true;
    try{
      var text=await photoToWords(files, function(m){ status.textContent=m; });
      status.textContent='';
      var lines=text.split('\n').filter(function(l){ return l.trim(); }).length;
      var toOfficial=false;
      if(canOfficial){
        toOfficial=await confirmBox('어디에 넣을까요?\n\n예 = 공식 단어장 (모두가 풀고 점수가 쌓임)\n아니오 = 내 단어장 (나만 보고 점수 없음)');
      }
      $('photo-modal').hidden=true;
      openAdd(toOfficial);
      $('add-text').value=text;
      $('add-name').focus();
      await alertBox('사진에서 '+lines+'줄을 읽었습니다.\n\n내용을 확인하고 단어장 이름을 정한 뒤 저장하세요.');
    }catch(err){
      status.textContent='';
      await alertBox('사진을 읽지 못했습니다.\n\n'+(err && err.message? err.message:''));
    }finally{ go.disabled=false; }
  });

  $('photo-modal').hidden=false;
  if(!ki.value) ki.focus();
}

function openGivePoints(u){
  var body=$('user-body'); body.innerHTML='';
  body.appendChild(el('h2',null, u.name+' 님에게 점수 주기'));
  body.appendChild(el('p','desc','지금 누적 점수는 '+u.score.toLocaleString()+'점입니다.\n음수를 넣으면 점수를 뺍니다.'));

  var inp=document.createElement('input');
  inp.type='number'; inp.className='gp-in'; inp.placeholder='예: 500'; inp.step='10';
  body.appendChild(inp);

  var quick=el('div','gp-quick');
  [100,500,1000,3000,-100,-500].forEach(function(n){
    var b=el('button','btn-mini'+(n<0?' warn':''), (n>0?'+':'')+n.toLocaleString());
    b.addEventListener('click', function(){ inp.value=String(n); inp.focus(); });
    quick.appendChild(b);
  });
  body.appendChild(quick);

  var note=el('p','gp-note','');
  body.appendChild(note);
  function preview(){
    var v=parseInt(inp.value,10);
    note.textContent = isNaN(v)? '' : (u.score.toLocaleString()+'점 → '+Math.max(0,u.score+v).toLocaleString()+'점');
  }
  inp.addEventListener('input', preview);

  var go=el('button','btn-primary','점수 주기');
  go.style.marginTop='14px';
  go.addEventListener('click', async function(){
    var v=parseInt(inp.value,10);
    if(isNaN(v) || v===0){ await alertBox('줄 점수를 입력하세요.'); return; }
    var ok=await confirmBox(u.name+' 님에게 '+(v>0?'+':'')+v.toLocaleString()+'점을 '+(v>0?'줄':'뺄')+'까요?');
    if(!ok) return;
    go.disabled=true;
    var fresh=await loadUser(u.id) || u;
    fresh.score=Math.max(0, (fresh.score||0)+v);
    await Store.set(K_USER+fresh.id, fresh);
    if(me && me.id===fresh.id){ me=fresh; renderAccountBar(); }
    if(me) await sendDM(fresh.id, '[관리자] 점수가 '+(v>0?'+':'')+v.toLocaleString()+'점 조정되었습니다. 현재 '+fresh.score.toLocaleString()+'점입니다.');
    $('user-modal').hidden=true;
    await alertBox(fresh.name+' 님의 점수가 '+fresh.score.toLocaleString()+'점이 되었습니다.');
    showAdmin();
  });
  body.appendChild(go);
  $('user-modal').hidden=false;
  setTimeout(function(){ inp.focus(); },60);
}

  panel.appendChild(sp);

  /* 공지 */

  s2.appendChild(el('h3',null,'공지'));
  s2.appendChild(el('p','desc','학습 화면 맨 위에 모두에게 보입니다. 비워 두면 표시되지 않습니다.'));
  var ta=document.createElement('textarea'); ta.className='admin-ta'; ta.value=notice;
  s2.appendChild(ta);
  var sv=el('button','btn-create','공지 저장'); sv.style.marginTop='10px';
  sv.addEventListener('click', async function(){
    notice=ta.value.trim();
    await Store.set(K_NOTICE,notice);
    await alertBox('공지를 저장했습니다.');
  });
  s2.appendChild(sv);
  panel.appendChild(s2);

  /* 사용자 관리 */
  var s3=el('div','admin-sec');
  s3.appendChild(el('h3',null,'전체 사용자'));
  s3.appendChild(el('p','desc','이름으로 검색해서 순위와 점수를 보고, 점수를 주거나 빼고, 점수 초기화·계정 삭제·관리자 지정을 할 수 있습니다.'));

  si.type='text'; si.placeholder='아이디로 검색'; si.value=adminUserQuery;
  bar.appendChild(si);
  s3.appendChild(bar);
  var holder=el('div'); s3.appendChild(holder);
  panel.appendChild(s3);

  var users=await allUsers();
  users.sort(function(a,b){ return rankPointOf(b)-rankPointOf(a); });
  users.forEach(function(u,i){ u._rank=i+1; });

  function drawUsers(){
    holder.innerHTML='';
    var view=users.filter(function(u){ return !adminUserQuery || u.name.toLowerCase().indexOf(adminUserQuery.toLowerCase())!==-1; });
    if(!view.length){ holder.appendChild(el('p','admin-note', users.length? '검색 결과가 없습니다.':'가입한 사용자가 없습니다.')); return; }

      var a=el('button','btn-mini', u.admin?'관리자 해제':'관리자 지정');
      a.addEventListener('click', async function(){
        if(u.id===me.id && u.admin){ await alertBox('자기 자신의 관리자 권한은 해제할 수 없습니다.'); return; }
        u.admin=!u.admin;
        await Store.set(K_USER+u.id,u);
        showAdmin();
      });
      row.appendChild(a);
      if(u.id!==me.id){
        var d=el('button','btn-mini red','계정 삭제');
        d.addEventListener('click', async function(){
          var ok=await confirmBox(u.name+' 님의 계정을 삭제할까요?\n되돌릴 수 없습니다.');
          if(!ok) return;
          await Store.del(K_USER+u.id);
          showAdmin();
        });
        row.appendChild(d);
      }
      holder.appendChild(row);
    });
  }
  si.addEventListener('input', function(){ adminUserQuery=si.value; drawUsers(); });
  drawUsers();

  var s4=el('div','admin-sec');
  s4.appendChild(el('h3',null,'참고'));
  s4.appendChild(el('p','admin-note',

      : '지금은 공유 저장소를 쓸 수 없어 이 기기 안에서만 저장됩니다. 랭킹도 이 기기 기준으로만 보입니다.')
    +'\n관리자는 가장 먼저 가입한 계정이며, 아래 목록에서 다른 사람에게도 권한을 줄 수 있습니다.'
    +'\n비밀번호는 간단하게만 보호되므로 다른 곳에서 쓰는 비밀번호는 쓰지 않는 게 좋습니다.'));
  panel.appendChild(s4);
}
